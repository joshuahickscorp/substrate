# Developmental capacity ladder (Frontier 32). The measurable rungs of the north-star loop
# (north_star.DEVELOPMENTAL_LOOP). Each rung is a CAPACITY operationalized as a measurement with a
# null hypothesis, never a sentience claim (see Frontier 35 rails). Validated by
# devsys.devel.capacities.validate_capability: every rung must carry every contract field.
#
# rungs are ordered; a higher rung's promotion_rule may reference a lower rung being green.
# status in {measured-now, prototype-local, studio-later, deferred}. tag is a capability family.
# local_test names a check that runs on the M3 Pro (generated controls / tiny caches); studio_test
# names the natural-video version. metric/baseline/ablation/null mirror the experiment contract.
#
# Form per BLACKHOLE.md: no em dashes or en dashes (commas, colons, parentheses only).

version: 1

capacities:

  - rung: 1
    name: sensory grounding
    tag: perception
    thesis: a frozen V-JEPA latent is a stable, decodable, provenance-stamped percept
    metric: linear-probe accuracy above chance on a held-out split; cache provenance present
    baseline: random-projection latents (frozen_random backend)
    ablation: shuffle labels (decodability must collapse to chance)
    null_hypothesis: latents are not linearly decodable above chance (grounding fails)
    local_test: diagnostics.linear_probe on a tiny generated-control cache
    studio_test: linear_probe on real V-JEPA natural-video latents
    failure_interpretation: data/representation problem (encoder or cache), not a learning failure
    provenance_tag: structured-synthetic
    status: measured-now
    promotion_rule: probe decodable AND cache validate_cache clean

  - rung: 2
    name: object and event permanence
    tag: abstraction
    thesis: latents carry occlusion/reveal and relation-change structure
    metric: probe accuracy on permanence vs vanish, occluded vs revealed control families
    baseline: static-frame probe (no temporal info)
    ablation: scramble frame order (temporal binding must drop)
    null_hypothesis: permanence/occlusion are not decodable from pooled latents
    local_test: probe over controls.object_permanence / occlusion_reveal / relation_change
    studio_test: probe over real occlusion clips
    failure_interpretation: pooled features may be too coarse; dense (2.1) reserved/deferred
    provenance_tag: structured-synthetic
    status: prototype-local
    promotion_rule: rung 1 green AND permanence probe above chance

  - rung: 3
    name: episodic memory
    tag: memory
    thesis: events are recallable by content via the latent hippocampus
    metric: nearest-neighbor retrieval recall@k; replay usefulness (BWT delta with replay)
    baseline: no memory (online only)
    ablation: random retrieval instead of KV/brute index
    null_hypothesis: retrieval/replay does not beat no-memory on retention
    local_test: buffer KV/brute retrieve over a tiny cache; recall@k check
    studio_test: retrieval over a large natural-video latent store
    failure_interpretation: memory structure or index problem, not perception
    provenance_tag: provisional
    status: measured-now
    promotion_rule: rung 1 green AND recall@k above random

  - rung: 4
    name: plastic adaptation
    tag: plasticity
    thesis: the shell learns new domains fast without catastrophic forgetting
    metric: adaptation speed + BWT (naive forgets, protected retains); the E1 gate
    baseline: naive sequential fine-tuning
    ablation: disable consolidation + replay (forgetting must return)
    null_hypothesis: protected condition does not retain better than naive
    local_test: E1 toy gate on generated/synthetic latents
    studio_test: E1 over natural-video domain-incremental streams
    failure_interpretation: plasticity/optimization or consolidation wiring problem
    provenance_tag: provisional
    status: measured-now
    promotion_rule: E1 gate passes (naive_forgets AND protected_retains AND both_learn_last)

  - rung: 5
    name: consolidation
    tag: plasticity
    thesis: offline replay + EWC/SI trade plasticity for retention measurably
    metric: retention after interference; consolidation-vs-plasticity Pareto point
    baseline: replay-only
    ablation: EWC lambda 0 (consolidation off)
    null_hypothesis: consolidation does not improve retention at matched plasticity
    local_test: E2/E3 toy legs (replay scheme + plasticity schedule)
    studio_test: long natural-video streams where Fisher saturates
    failure_interpretation: consolidation estimator weakness (documented Fisher saturation)
    provenance_tag: provisional
    status: measured-now
    promotion_rule: rung 4 green AND retention improves vs replay-only baseline

  - rung: 6
    name: curiosity
    tag: active-curriculum
    thesis: data selection by learning-progress beats error-seeking and rejects noisy-TV
    metric: learnable-region coverage vs noise time-share; noisy-TV rejection rate
    baseline: uniform/random sampling
    ablation: prediction-error sampling (must chase the noisy-TV)
    null_hypothesis: learning-progress selection does not beat random on a learnable budget
    local_test: curriculum engine over controls (must spend near-zero on noisy_tv)
    studio_test: active subset selection for the next Tier C cache
    failure_interpretation: novelty/uncertainty signal mis-specified (aleatoric vs epistemic)
    provenance_tag: provisional
    status: prototype-local
    promotion_rule: rung 1 green AND noisy-TV time-share below threshold

  - rung: 7
    name: abstraction
    tag: abstraction
    thesis: structure emerges as clusters/codebooks/graphs over latents
    metric: cluster purity / codebook usage / successor-representation probe accuracy
    baseline: raw-latent probe (no abstraction layer)
    ablation: random codebook assignment
    null_hypothesis: abstraction layer adds no decodable structure over raw latents
    local_test: kmeans/codebook over a tiny cache; purity vs labels
    studio_test: codebooks/graph heads over natural-video latents
    failure_interpretation: pooled features too coarse; dense path deferred
    provenance_tag: provisional
    status: prototype-local
    promotion_rule: rung 1 green AND abstraction probe beats raw-latent baseline

  - rung: 8
    name: causal and affordance sketch
    tag: world-model
    thesis: an action-conditioned latent predictor is sensitive to transitions where actions exist
    metric: short-horizon latent prediction error; transition sensitivity to action
    baseline: action-agnostic predictor
    ablation: shuffle actions (sensitivity must vanish)
    null_hypothesis: action conditioning does not reduce rollout error
    local_test: latent rollout quality check on action-conditioned synthetic transitions
    studio_test: action-conditioned prediction on robot/ego data (Tier E/R for live action)
    failure_interpretation: no action signal in cached clips; live action is Tier E/R
    provenance_tag: provisional
    status: studio-later
    promotion_rule: rung 1 green AND action conditioning beats action-agnostic baseline

  - rung: 9
    name: self-monitoring
    tag: self-monitoring
    thesis: the learner knows when it does not know (calibrated uncertainty, failure flags)
    metric: calibration ECE; epistemic uncertainty rises on out-of-distribution / noise
    baseline: max-softmax confidence
    ablation: remove ensemble/uncertainty head
    null_hypothesis: uncertainty is uninformative about correctness (ECE no better than chance)
    local_test: diagnostics.calibration + noisy_tv epistemic-collapse check
    studio_test: calibration on natural-video held-out domains
    failure_interpretation: evaluation/uncertainty-head problem, not perception
    provenance_tag: provisional
    status: measured-now
    promotion_rule: rung 1 green AND noisy_tv epistemic_collapses_on_noise AND ECE bounded

  - rung: 10
    name: language-mediated learning
    tag: multimodal
    thesis: captions/instructions as AUXILIARY metadata improve sample selection, not a foundation model
    metric: text/video retrieval diagnostic; caption-conditioned selection gain
    baseline: no-language selection
    ablation: shuffle captions (gain must vanish)
    null_hypothesis: language metadata does not improve selection or retrieval
    local_test: schema check + caption-stub retrieval over a tiny annotated control set
    studio_test: caption/narration metadata over instructional video subsets
    failure_interpretation: annotation quality or alignment problem
    provenance_tag: metadata-only
    status: studio-later
    promotion_rule: rung 1 green AND language selection beats no-language baseline

  - rung: 11
    name: social and teacher lane
    tag: active-curriculum
    thesis: user-provided curriculum/demonstrations/corrections steer learning
    metric: gain from teacher-ordered curriculum vs self-ordered; correction uptake
    baseline: self-ordered curriculum
    ablation: random teacher order
    null_hypothesis: teacher curriculum does not beat self-ordered on the same budget
    local_test: curriculum engine accepts a user goal/order over controls
    studio_test: teacher-ordered natural-video curriculum
    failure_interpretation: curriculum signal or transfer problem
    provenance_tag: provisional
    status: prototype-local
    promotion_rule: rung 6 green AND teacher order beats self order or ties at lower cost

  - rung: 12
    name: skill library
    tag: meta-learning
    thesis: reusable heads/modules and a task fingerprint enable transfer
    metric: forward transfer (FWT); skill reuse rate; task-fingerprint retrieval accuracy
    baseline: train-from-scratch per task
    ablation: random module selection
    null_hypothesis: skill reuse does not produce positive forward transfer
    local_test: reuse a cached head across two toy tasks; measure FWT
    studio_test: transfer map across natural-video domains
    failure_interpretation: module specialization or routing problem
    provenance_tag: provisional
    status: studio-later
    promotion_rule: rung 7 green AND FWT positive vs from-scratch baseline

  - rung: 13
    name: meta-learning
    tag: meta-learning
    thesis: the system chooses which mechanism to try next by expected information gain per compute hour
    metric: realized info gain vs predicted ranking (ablation engine calibration)
    baseline: fixed experiment order
    ablation: random next-experiment choice
    null_hypothesis: the ranking does not beat random ordering on info gain per hour
    local_test: ablation engine ranks a tiny plan; realized vs predicted on toy legs
    studio_test: next-best-experiment selection across the Tier C campaign
    failure_interpretation: cost model or info-gain estimate mis-specified
    provenance_tag: provisional
    status: prototype-local
    promotion_rule: rungs 1-9 instrumented AND ranking beats random on a held-out batch

  - rung: 14
    name: identity and provenance continuity
    tag: self-monitoring
    thesis: the system can state what it has seen, remembered, forgotten, and updated over time
    metric: provenance/metacognition report completeness; reconstructable learning history
    baseline: no provenance
    ablation: drop provenance sidecars (history becomes unreconstructable)
    null_hypothesis: the learning history cannot be reconstructed from artifacts
    local_test: metacognition report over a local-max run + cache provenance
    studio_test: continuity report across a multi-day Studio campaign
    failure_interpretation: provenance/logging gap, not a capacity of the learner
    provenance_tag: provisional
    status: measured-now
    promotion_rule: every artifact carries provenance AND the metacognition report renders
