# Paradigm frontier registry (Frontier 20). The stones turned over: scoped candidate learning
# mechanisms (Frontiers 21-30), each with gates, an expected signature, a null interpretation, and a
# minimum viable LOCAL test. NOT random experiments, NOT promoted science. Validated by
# devsys.devel.paradigms.validate_paradigm: every entry carries every contract field, status is in
# the closed set, and a speculative entry can never carry result_tag real/natural-video.
#
# changes in {data, memory, optimizer, architecture, objective, routing, inference, curriculum, evaluation}
# status in {implement-now, prototype-local, studio-later, paper-watch, blocked}
# tags from {plasticity, abstraction, memory, local-learning, meta-learning, active-curriculum,
#            world-model, modularity, test-time-adaptation, neuro-symbolic, generative, multimodal}
# vjepa_compat in {cached-pooled, dense-2.1, action-conditioned, metadata} (compat with frozen latents)
#
# Form per BLACKHOLE.md: no em dashes or en dashes (commas, colons, parentheses only).

version: 1

paradigms:

  # ---- Frontier 21: plasticity and fast weights ----
  - slug: test_time_adaptation
    name: Test-time adaptation / fast weights
    thesis: a small fast-weight overlay adapts to a new domain at inference without touching slow weights
    family: plasticity
    citation: "Sun et al., test-time training; Ba et al., fast weights"
    changes: optimizer
    vjepa_compat: cached-pooled
    mvp_local_test: fast-weight head adapts on one toy domain shift; revert restores base
    studio_test: TTA on natural-video domain shift vs frozen-head baseline
    compute_risk: low
    expected_signature: lower error on shifted domain with bounded forgetting of base
    null_interpretation: TTA does not beat a frozen head at matched parameters (no fast adaptation)
    tags: [plasticity, test-time-adaptation]
    status: prototype-local

  - slug: shrink_and_perturb
    name: Shrink-and-perturb / rejuvenation
    thesis: periodic shrink+noise restores lost plasticity (dead features) under continual updates
    family: plasticity
    citation: "Ash and Adams, warm-start; Dohare et al., loss of plasticity"
    changes: optimizer
    vjepa_compat: cached-pooled
    mvp_local_test: dead-feature/spectral-collapse diagnostic before vs after rejuvenation
    studio_test: long natural-video stream with rejuvenation schedule
    compute_risk: low
    expected_signature: recovered effective rank / fewer dead units, retained accuracy
    null_interpretation: rejuvenation does not restore plasticity or hurts retention
    tags: [plasticity]
    status: prototype-local

  - slug: meta_learned_init
    name: Meta-learned initialization (rapid adaptation)
    thesis: a meta-learned init adapts to new tasks in fewer steps than a generic init
    family: optimizer
    citation: "Finn et al., MAML"
    changes: optimizer
    vjepa_compat: cached-pooled
    mvp_local_test: adaptation-speed metric vs random init on toy task family
    studio_test: few-shot domain adaptation on natural-video
    compute_risk: medium
    expected_signature: fewer steps to threshold accuracy on held-out tasks
    null_interpretation: meta-init does not reduce adaptation steps vs control init
    tags: [plasticity, meta-learning]
    status: studio-later

  # ---- Frontier 22: abstraction and object-relation ----
  - slug: codebook_abstraction
    name: Discrete codebook / VQ abstraction
    thesis: a learned codebook over latents yields reusable discrete concepts
    family: architecture
    citation: "van den Oord et al., VQ-VAE"
    changes: architecture
    vjepa_compat: cached-pooled
    mvp_local_test: codebook usage + cluster purity vs labels on a tiny cache
    studio_test: codebooks over natural-video latents; downstream probe gain
    compute_risk: low
    expected_signature: high codebook usage and above-baseline cluster purity
    null_interpretation: codebook adds no decodable structure over raw latents
    tags: [abstraction]
    status: prototype-local

  - slug: successor_representation
    name: Successor representation over latent clusters
    thesis: an SR over latent states captures temporal/relational structure for transfer
    family: objective
    citation: "Dayan, successor representation; Stachenfeld et al."
    changes: objective
    vjepa_compat: cached-pooled
    mvp_local_test: SR probe accuracy vs raw-latent probe on toy transitions
    studio_test: SR over natural-video event sequences
    compute_risk: medium
    expected_signature: SR improves next-state/relation decoding over raw latents
    null_interpretation: SR provides no transfer benefit over raw-latent features
    tags: [abstraction, world-model]
    status: studio-later

  - slug: object_slot_probe
    name: Object/slot-like probes (dense path)
    thesis: object-centric structure is recoverable from dense per-token features
    family: architecture
    citation: "Locatello et al., slot attention"
    changes: architecture
    vjepa_compat: dense-2.1
    mvp_local_test: deferred; pooled features lack per-token structure
    studio_test: slot probes on V-JEPA 2.1 dense tokens
    compute_risk: medium
    expected_signature: object-count / what-where decoding above pooled baseline
    null_interpretation: pooled features cannot support object slots (expected; needs dense)
    tags: [abstraction]
    status: blocked

  # ---- Frontier 23: memory systems ----
  - slug: hopfield_associative_memory
    name: Associative / Hopfield memory
    thesis: modern Hopfield retrieval stores more patterns per slot than FIFO
    family: memory
    citation: "Ramsauer et al., modern Hopfield networks"
    changes: memory
    vjepa_compat: cached-pooled
    mvp_local_test: pattern capacity vs FIFO on a tiny store (assoc-memory study exists)
    studio_test: associative recall over a large latent store
    compute_risk: low
    expected_signature: higher recall capacity per slot than FIFO baseline
    null_interpretation: associative memory does not beat FIFO capacity
    tags: [memory]
    status: prototype-local

  - slug: uncertainty_indexed_memory
    name: Uncertainty-indexed memory
    thesis: prioritizing replay by epistemic uncertainty improves retention per slot
    family: memory
    citation: "prioritized replay; ensemble disagreement"
    changes: memory
    vjepa_compat: cached-pooled
    mvp_local_test: retention vs random/priority eviction on toy stream
    studio_test: uncertainty-indexed replay on natural-video
    compute_risk: low
    expected_signature: better retention at matched memory budget
    null_interpretation: uncertainty indexing ties random eviction (corpus null)
    tags: [memory, self-monitoring]
    status: prototype-local

  - slug: generative_latent_replay
    name: Generative latent replay
    thesis: a latent generator replaces stored exemplars, trading storage for a learned prior
    family: memory
    citation: "Shin et al., deep generative replay"
    changes: memory
    vjepa_compat: cached-pooled
    mvp_local_test: deferred; needs a latent VAE prior (optional future work)
    studio_test: generative replay vs stored replay at matched budget
    compute_risk: high
    expected_signature: retention near stored-replay at lower storage
    null_interpretation: generated replay underperforms stored replay (distribution gap)
    tags: [memory, generative]
    status: studio-later

  # ---- Frontier 24: alternative learning pathways ----
  - slug: forward_forward
    name: Forward-Forward objective
    thesis: a local goodness objective learns without a global backward pass
    family: objective
    citation: "Hinton, the Forward-Forward algorithm"
    changes: objective
    vjepa_compat: cached-pooled
    mvp_local_test: I4 harness includes FF; non-vacuous accuracy vs backprop ceiling
    studio_test: FF at scale on natural-video probes
    compute_risk: low
    expected_signature: above-chance learning, below backprop ceiling (a clean gap)
    null_interpretation: FF fails to learn the task (vacuous), a real negative result
    tags: [local-learning]
    status: prototype-local

  - slug: predictive_coding
    name: Predictive coding approximation
    thesis: layerwise prediction-error minimization approximates backprop locally
    family: objective
    citation: "Rao and Ballard; Millidge et al."
    changes: objective
    vjepa_compat: cached-pooled
    mvp_local_test: I4 PC variant; gap-vs-depth study exists (pc_depth)
    studio_test: PC depth scaling on natural-video
    compute_risk: medium
    expected_signature: PC-vs-backprop gap widens with depth (documented)
    null_interpretation: PC matches backprop trivially (suspect implementation) or fails
    tags: [local-learning]
    status: prototype-local

  # ---- Frontier 25: modularity, routing, architecture ----
  - slug: mixture_of_experts
    name: Mixture-of-experts routing
    thesis: sparse expert routing reduces interference across domains
    family: routing
    citation: "Shazeer et al., sparsely-gated MoE"
    changes: routing
    vjepa_compat: cached-pooled
    mvp_local_test: routing entropy + module specialization on toy domain mix
    studio_test: MoE over natural-video domains; interference/transfer metrics
    compute_risk: medium
    expected_signature: specialized experts, lower cross-domain interference at matched params
    null_interpretation: routing collapses to one expert or adds no transfer benefit
    tags: [modularity]
    status: studio-later

  - slug: progressive_networks
    name: Progressive networks / lateral connections
    thesis: frozen columns + lateral connections give transfer without forgetting
    family: architecture
    citation: "Rusu et al., progressive neural networks"
    changes: architecture
    vjepa_compat: cached-pooled
    mvp_local_test: forward transfer vs from-scratch on two toy tasks (param-matched)
    studio_test: progressive columns across natural-video domains
    compute_risk: medium
    expected_signature: positive FWT with zero backward forgetting by construction
    null_interpretation: lateral connections add no transfer over independent heads
    tags: [modularity, meta-learning]
    status: studio-later

  # ---- Frontier 26: active curriculum and data selection ----
  - slug: learning_progress_sampling
    name: Learning-progress data selection
    thesis: sampling by learning progress beats error-seeking and rejects noisy-TV
    family: curriculum
    citation: "Oudeyer et al., intrinsic motivation; Schmidhuber, compression progress"
    changes: curriculum
    vjepa_compat: cached-pooled
    mvp_local_test: curriculum engine over controls spends near-zero on noisy_tv
    studio_test: active subset selection for the next Tier C cache
    compute_risk: low
    expected_signature: higher learnable coverage per budget, low noise time-share
    null_interpretation: learning-progress ties uniform sampling (no curriculum benefit)
    tags: [active-curriculum]
    status: implement-now

  # ---- Frontier 27: world-model and planning ----
  - slug: latent_rollout_mpc
    name: Latent rollout + model-predictive control stub
    thesis: short-horizon latent rollouts support goal-conditioned planning where actions exist
    family: inference
    citation: "Hafner et al., world models / Dreamer"
    changes: inference
    vjepa_compat: action-conditioned
    mvp_local_test: rollout error + goal-conditioned latent distance on synthetic transitions
    studio_test: MPC stub on robot/ego action data (live control Tier E/R)
    compute_risk: high
    expected_signature: calibrated short-horizon rollout, goal distance decreases under plan
    null_interpretation: rollouts are not predictive enough to plan (gate by predictability)
    tags: [world-model]
    status: studio-later

  # ---- Frontier 28: multimodal and language-conditioned ----
  - slug: language_conditioned_selection
    name: Language-conditioned goal/selection metadata
    thesis: captions/instructions as metadata steer selection without a multimodal foundation model
    family: data
    citation: "CLIP-style retrieval; instruction-conditioned learning"
    changes: data
    vjepa_compat: metadata
    mvp_local_test: schema check + caption-stub retrieval over a tiny annotated set
    studio_test: caption/narration metadata over instructional video
    compute_risk: low
    expected_signature: language metadata improves retrieval/selection over no-language
    null_interpretation: language metadata gives no selection gain (alignment/quality issue)
    tags: [multimodal, active-curriculum]
    status: studio-later

  # ---- neuro-symbolic (paper-watch) ----
  - slug: neuro_symbolic_concepts
    name: Neuro-symbolic concept bottleneck
    thesis: a concept bottleneck makes abstractions inspectable and editable
    family: architecture
    citation: "Koh et al., concept bottleneck models"
    changes: architecture
    vjepa_compat: cached-pooled
    mvp_local_test: concept-probe accuracy where labels exist
    studio_test: concept bottleneck over labeled natural-video
    compute_risk: medium
    expected_signature: concepts decodable and intervention changes predictions predictably
    null_interpretation: concepts not decodable / interventions inert
    tags: [neuro-symbolic, abstraction]
    status: paper-watch
