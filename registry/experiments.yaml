# Experiment bank registry (the machine-readable, preregistered source of truth). Catalogs the whole
# bank: the conducted experiments (E1-E10), the cross-cutting comparison (I4), the bleeding-edge
# EX-series (EX1-EX18, EX1-16 from docs/STUDIO_MAXIMIZATION_2026_06_27.md Section 6, EX17/EX18 the
# latent-reasoning line added here), and the reusable diagnostics (D) + ablations (A) that gate and
# control them. This file IS the preregistration: a row's null, headline metric, falsifier, and
# failure-taxonomy slot are committed here before it runs. Validated by
# mop.devel.registries.validate_experiment; EXPERIMENTS.md is regenerated FROM this file.
#
# Honesty rules enforced in code:
#   - kind in {experiment, cross-cutting, diagnostic, ablation}
#   - exp_tier (runnable Experiment.tier) in {cpu-now, gpu-later, env-later, 2.1-only}
#   - resource_tier (planning) in {cpu-now, studio-scale, environment-needed, weights-needed, moonshot}
#   - status in {implemented, registry-only, deferred}; an implemented experiment/cross-cutting row
#     MUST have a matching id in mop.experiments.REGISTRY; an implemented diagnostic/ablation MUST
#     name an existing module path
#   - taxonomy_slot in 1..10 (proof/FAILURE_TAXONOMY.md); every row carries null + metric + falsifier
#   - free-text scanned by the north_star sentience rail (engineering vocabulary only)
#
# Form per BLACKHOLE.md: no em dashes or en dashes (commas, colons, parentheses only).

version: 1

experiments:

  # ============================================================ conducted bank (E1-E10) + I4
  - id: e1_baseline
    name: Baseline continual harness (GATE)
    kind: experiment
    series: E
    question: does a protected learner retain across a domain-incremental stream while a naive learner forgets, both still learning the last task
    mechanism: replay + EWC protected arm vs naive sequential arm over a domain/class-incremental latent stream
    null_hypothesis: with shuffled task labels or matched capacity/difficulty, naive and protected show no retention gap; no forgetting means tasks too easy, no learning means target not decodable
    falsifier: protected_bwt does not beat naive_bwt by the retain margin, or both arms fail the last task
    metrics: [backward_transfer, forward_transfer, adaptation_speed, frontier_auc]
    controls: [shuffled-label, frozen-random-substrate, difficulty-separation]
    gates: [linear_probe, determinism]
    resource_tier: cpu-now
    exp_tier: cpu-now
    runtime_class: seconds
    difficulty: medium
    sci_value: high
    meaningless_risk: low
    relation: the gate every downstream result depends on
    capacity_rungs: [4]
    paradigm_slugs: []
    taxonomy_slot: 5
    status: implemented
    proof: {atlas_factor: identity, null_card: "proof/NULL_CARDS/e1.md", evidence_level: R3}

  - id: e2_replay
    name: Latent hippocampus (replay)
    kind: experiment
    series: E
    question: does prioritized replay buy retention over random and no-replay at matched buffer size
    mechanism: PER replay buffer arms (none/random/prioritized/+EWC) over the continual stream
    null_hypothesis: prioritized replay ties random replay, or replay ties no-replay (stream too short or latents not distinct)
    falsifier: no replay arm improves frontier AUC or BWT beyond the seed spread
    metrics: [frontier_auc, backward_transfer]
    controls: [matched-buffer-size, frozen-random-substrate]
    gates: [linear_probe]
    resource_tier: cpu-now
    exp_tier: cpu-now
    runtime_class: seconds
    difficulty: medium
    sci_value: high
    meaningless_risk: low
    relation: feeds the Level-5 headline; extended by EX1/EX13/EX14
    capacity_rungs: [3]
    paradigm_slugs: [uncertainty_indexed_memory]
    taxonomy_slot: 5
    status: implemented
    proof: {atlas_factor: identity, null_card: "proof/NULL_CARDS/e2.md", evidence_level: R2}

  - id: e3_plasticity
    name: Critical-period schedule (staged plasticity)
    kind: experiment
    series: E
    question: does a staged plasticity schedule beat constant and tuned-decay learning rates on the frontier
    mechanism: plasticity arms (constant/decay/staged/triggered) + Fisher-trace critical-period signature
    null_hypothesis: staged plasticity ties constant LR and tuned cosine decay (an LR trick, nothing to shape on a frozen substrate)
    falsifier: staged frontier AUC within seed spread of the best tuned-decay baseline
    metrics: [frontier_auc, parameter_drift, fisher_trace]
    controls: [tuned-cosine-decay, frozen-random-substrate]
    gates: [fisher_trace, determinism]
    resource_tier: cpu-now
    exp_tier: cpu-now
    runtime_class: seconds
    difficulty: medium
    sci_value: medium
    meaningless_risk: medium
    relation: feeds Level-5; extended by EX15 rejuvenation
    capacity_rungs: [4, 5]
    paradigm_slugs: [shrink_and_perturb]
    taxonomy_slot: 2
    status: implemented
    proof: {atlas_factor: identity, null_card: "proof/NULL_CARDS/e3.md", evidence_level: R2}

  - id: e4_neuromod
    name: Neuromodulation (uncertainty gating)
    kind: experiment
    series: E
    question: does ensemble-disagreement gating adapt on the learnable region while ignoring the noisy-TV
    mechanism: three gates (ungated / point-error / disagreement) on the noisy-TV split + calibration
    null_hypothesis: point prediction-error gating chases the noisy-TV as much as ungated (conflates epistemic and aleatoric); needs a distributional signal
    falsifier: disagreement gate-on-noise not below the ignore threshold, or point-error not above the chase threshold
    metrics: [adapt_speed_learnable, gate_on_noise, calibration_ece]
    controls: [noisy-TV, point-error-baseline]
    gates: [noisy_tv, calibration]
    resource_tier: cpu-now
    exp_tier: cpu-now
    runtime_class: seconds
    difficulty: medium
    sci_value: high
    meaningless_risk: low
    relation: uncertainty signal feeds E2/E3 triggers and EX6/EX8 selection
    capacity_rungs: [9, 6]
    paradigm_slugs: [uncertainty_indexed_memory]
    taxonomy_slot: 8
    status: implemented
    proof: {atlas_factor: controllability, null_card: "proof/NULL_CARDS/e4.md", evidence_level: R2}

  - id: e5_curiosity
