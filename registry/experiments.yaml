  - id: f20_substrate_crisis_test
    name: substrate_crisis_test
    kind: experiment
    series: F
    question: "can a monitor over the form matrix detect ahead of time that frozen forms plus larger shells will fail a target, while staying quiet on irreducible noise"
    mechanism: "build matrices containing known-insufficient arms (nuisance-carrier and predictor-wall exemplars) plus noisy-TV false-alarm streams; score crisis predictions against realized probe failure"
    null_hypothesis: "the crisis detector fails to beat the strongest raw-error, fixed-confidence, or random baseline, or triggers on aleatoric noise, so prospective insufficiency is not established"
    falsifier: "a preregistered prospective crisis forecast beats every baseline, stays quiet on noise, and avoids a measured failed scale-up"
