  - id: f18_counterfactual_form_intervention
    name: counterfactual_form_intervention
    kind: experiment
    series: F
    question: "does intervening on a factor observed through one form predict the induced change in another form over the same referent, beyond a correlational map"
    mechanism: "programmatic randomized interventions rendered as paired Form-A before and Form-B after states; a vector-valued state transport is compared to an identical correlational map on unseen intervention values with rows, updates, parameters, and FLOPs matched"
    null_hypothesis: "the intervention predictor leaks (predicts only seen intervention values) or ties the correlational predictor, so the matrix binds appearances rather than intervention structure"
    falsifier: "decoded and geometric Form-B predictions on unseen intervention values beat correlational, random-direction, and shuffled-counterfactual controls across five seeds at exactly matched training compute"
