    kind: experiment
    series: F
    question: "can the same referent be stored and retrieved at object, scene, episode, and task scale without a separate memory per scale"
    mechanism: "nested referent ids (object within scene within episode within task) enforced at intake; store at one scale, query at another, compare hierarchical memory to flat and single-scale stores at matched bytes"
