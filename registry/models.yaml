# Auxiliary / optional model registry (Frontier 2). The CANONICAL frozen substrates live in
# configs/encoder/*.yaml and are read by devsys.substrate.encoder_registry (the single source of
# truth for V-JEPA science). This file holds ONLY the optional, clearly-tagged extras that must
# NEVER silently replace canonical V-JEPA: comparison baselines, distilled students, quantized
# inference variants. devsys.studio.registry.load_models() merges canonical + these, tagging each
# row with role so a reader can never confuse an approximation for the real substrate.
#
# Honesty rules (enforced in devsys.studio.registry):
#   - role in {canonical, auxiliary, distilled, quantized}
#   - only role: canonical may carry result_tag real-encoder; everything else is auxiliary/approximate
#   - available: false until a weight set is actually verified on HF (no pretending)
#   - distilled/quantized rows carry replaces_canonical: false (a hard invariant the test pins)
#
# Form per BLACKHOLE.md: no em dashes or en dashes (commas, colons, parentheses only).

version: 1

models:

  # ---- V-JEPA 2.1 dense: announced, NOT on HF; placeholder stays unavailable until verified ----
  - slug: vjepa21_vitl_dense
    name: V-JEPA 2.1 ViT-L (dense)
    role: canonical                # would be canonical IF published; today it is unavailable
    hf_id: ""                      # not published on HuggingFace as of 2026-06
    embed_dim: 1024
    dense: true
    available: false
    result_tag: provisional        # cannot claim real-encoder until weights verify
    replaces_canonical: false
    note: "dense V-JEPA 2.1 not on HF; E6 dense path deferred (see configs/encoder/vjepa21_*)"

  # ---- optional comparison encoders (auxiliary baselines, never the science substrate) ----
  - slug: videomae_v2_vitb
    name: VideoMAE V2 ViT-B (comparison)
    role: auxiliary
    hf_id: "OpenGVLab/VideoMAEv2-Base"
    embed_dim: 768
    dense: false
    available: false               # not verified/fetched here; metadata-only until opted in
    result_tag: provisional
    replaces_canonical: false
    note: "auxiliary baseline ONLY; comparison, not a replacement for frozen V-JEPA"

  - slug: dinov2_vitl
    name: DINOv2 ViT-L (image, comparison)
    role: auxiliary
    hf_id: "facebook/dinov2-large"
    embed_dim: 1024
    dense: false
    available: false
    result_tag: provisional
    replaces_canonical: false
    note: "image encoder; auxiliary cross-modal diagnostic only, not a video substrate"

  # ---- distilled students (speed approximations of cached V-JEPA latents) ----
  - slug: student_distill_small
    name: Distilled student (small)
    role: distilled
    hf_id: ""                      # trained locally from cached V-JEPA latents (optimize lane)
    embed_dim: 512
    dense: false
    available: false               # only after the optional distillation step actually runs
    result_tag: provisional
    replaces_canonical: false      # HARD invariant: a student never stands in for the substrate
    note: "speed approximation distilled from cached V-JEPA latents; results tagged approximate"

  # ---- quantized inference variants (throughput experiments, approximate) ----
  - slug: vjepa2_vitl_int8
    name: V-JEPA 2 ViT-L (int8 inference)
    role: quantized
    hf_id: "facebook/vjepa2-vitl-fpc64-256"   # same weights, quantized at load for throughput
    embed_dim: 1024
    dense: false
    available: false               # only when a quantized-inference smoke actually runs
    result_tag: provisional
    replaces_canonical: false      # quantized numbers are approximate, never the canonical result
    note: "int8 inference throughput experiment; latents are APPROXIMATE, optimize lane only"
