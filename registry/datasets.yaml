# Dataset acquisition registry (Frontier 1). Machine-readable source catalog the Studio planner,
# downloader, data-card writer, and license ledger all read. ONE schema, validated by
# devsys.studio.registry.validate_dataset (every entry must carry every required field).
#
# Honesty rules enforced in code (devsys.studio.registry):
#   - status in {available, manual, deferred, blocked, metadata-only}
#   - kind in {natural-video, structured-synthetic, metadata-only, auxiliary, provisional}
#   - any source needing signed terms is status: manual (planner will not auto-select it unless the
#     profile allows manual auth AND the user passes the license acknowledgement)
#   - full Ego4D / Ego-Exo4D are status: deferred (far beyond a 1 TB local disk); the planner
#     refuses them by default regardless of acknowledgement
#   - sizes are honest GB estimates; recommended_subsets are the breadth-first slices the planner
#     prefers over one giant dataset
#
# Form per BLACKHOLE.md: no em dashes or en dashes (commas, colons, parentheses only).

version: 1

sources:

  # ---------------- action / motion video ----------------
  - slug: ssv2
    name: Something-Something V2
    modality: video
    domain: action-motion
    task_fit: clean labeled motion verbs; type/class-incremental streams (backs streams.yaml task/class)
    priority: 90
    raw_gb: 20.0
    cache_gb_pooled: 0.7          # ~220k clips pooled ViT-L (~8 KB/clip)
    recommended_subsets: [1000, 5000, 20000]
    license: "Qualcomm/20BN academic license (registration + accepted terms)"
    citation: "Goyal et al., The Something Something Video Database, ICCV 2017"
    allowed_use: research-only; no redistribution of raw clips
    auth_steps: "register at developer.qualcomm.com, accept the SSv2 terms, obtain the download token"
    download_method: http-token
    resume_method: per-file manifest + size check
    checksum_plan: per-file sha256 recorded in the acquisition manifest
    status: manual
    risk: {license: medium, size: low, link_rot: low, annotation_quality: high, privacy: low, decode: low}
    output_layout: class-folder        # source/<class>/<clip>.webm -> validate_source + cache_video
    kind: natural-video

  - slug: kinetics700_subset
    name: Kinetics-700 (subset)
    modality: video
    domain: action-broad
    task_fit: broad action diversity for domain-incremental breadth; large class space
    priority: 70
    raw_gb: 60.0                   # a subset; full K700 is ~650 GB and link-rotted
    cache_gb_pooled: 0.5
    recommended_subsets: [2000, 10000, 50000]
    license: "CC BY 4.0 annotations; each video under its own YouTube license"
    citation: "Carreira et al., A Short Note on the Kinetics-700 Human Action Dataset, 2019"
    allowed_use: annotations freely usable; bulk video needs a licensed mirror (no scraping)
    auth_steps: "use a licensed academic mirror for video; ID/label CSVs are open"
    download_method: mirror-or-metadata
    resume_method: per-id manifest; skip present ids
    checksum_plan: per-clip sha256; dedup by youtube id
    status: metadata-only          # ID/label CSVs now; bulk video is manual via a licensed mirror
    risk: {license: high, size: high, link_rot: high, annotation_quality: high, privacy: medium, decode: medium}
    output_layout: class-folder
    kind: natural-video

  # ---------------- egocentric video ----------------
  - slug: epic_kitchens_subset
    name: EPIC-KITCHENS-100 (subset)
    modality: video
    domain: egocentric-kitchen
    task_fit: egocentric domain shift vs ssv2; the E1-gate domain-incremental source
    priority: 80
    raw_gb: 80.0                   # subset of the ~700 GB full release
    cache_gb_pooled: 0.4
    recommended_subsets: [1000, 5000, 20000]
    license: "CC BY-NC 4.0"
    citation: "Damen et al., Rescaling Egocentric Vision, IJCV 2022"
    allowed_use: non-commercial research; attribution required
    auth_steps: "none for download; respect CC BY-NC 4.0"
    download_method: epic-download-script
    resume_method: official script resume + per-file manifest
    checksum_plan: official md5 manifest cross-checked, then sha256 recorded
    status: available
    risk: {license: low, size: high, link_rot: low, annotation_quality: high, privacy: medium, decode: medium}
    output_layout: class-folder
    kind: natural-video

  - slug: ego4d_subset
    name: Ego4D (subset)
    modality: video
    domain: egocentric-broad
    task_fit: large egocentric breadth; long-horizon domain shift (subset only)
    priority: 60
    raw_gb: 200.0                  # a curated subset; FULL Ego4D is multi-TB, see ego4d_full
    cache_gb_pooled: 1.0
    recommended_subsets: [2000, 10000]
    license: "Ego4D License Agreement (signed)"
    citation: "Grauman et al., Ego4D: Around the World in 3,000 Hours of Egocentric Video, CVPR 2022"
    allowed_use: research-only under the signed Ego4D license
    auth_steps: "sign the Ego4D license agreement, receive AWS credentials, use the ego4d CLI"
    download_method: ego4d-cli
    resume_method: ego4d CLI resume + per-file manifest
    checksum_plan: ego4d CLI manifest checksums recorded
    status: manual                 # subset is allowed AFTER the license is signed
    risk: {license: high, size: high, link_rot: low, annotation_quality: high, privacy: high, decode: medium}
    output_layout: class-folder
    kind: natural-video

  - slug: ego4d_full
    name: Ego4D (full)
    modality: video
    domain: egocentric-broad
    task_fit: complete egocentric corpus; far beyond a 1 TB local disk, planned only on dedicated storage
    priority: 5
    raw_gb: 7000.0
    cache_gb_pooled: 30.0
    recommended_subsets: []
    license: "Ego4D License Agreement (signed)"
    citation: "Grauman et al., Ego4D, CVPR 2022"
    allowed_use: research-only under the signed Ego4D license
    auth_steps: "sign the Ego4D license; provision multi-TB external storage"
    download_method: ego4d-cli
    resume_method: ego4d CLI resume
    checksum_plan: ego4d CLI manifest checksums
    status: deferred               # NEVER planned by default; > 1 TB disk
    risk: {license: high, size: extreme, link_rot: low, annotation_quality: high, privacy: high, decode: medium}
    output_layout: class-folder
    kind: natural-video

  - slug: ego_exo4d_subset
    name: Ego-Exo4D (subset)
    modality: video
    domain: egocentric-exocentric
    task_fit: paired ego/exo views; multi-view domain shift (subset only)
    priority: 40
    raw_gb: 300.0
    cache_gb_pooled: 1.5
    recommended_subsets: [2000]
    license: "Ego-Exo4D License Agreement (signed)"
    citation: "Grauman et al., Ego-Exo4D, CVPR 2024"
    allowed_use: research-only under the signed agreement
    auth_steps: "sign the Ego-Exo4D license, use the provided CLI"
    download_method: ego-exo4d-cli
    resume_method: CLI resume + manifest
    checksum_plan: CLI manifest checksums recorded
    status: deferred               # signed terms + very large; manual+deferred until access exists
    risk: {license: high, size: extreme, link_rot: low, annotation_quality: high, privacy: high, decode: medium}
    output_layout: class-folder
    kind: natural-video

  # ---------------- instructional video / text ----------------
  - slug: howto100m_meta
    name: HowTo100M (metadata)
    modality: video-text
    domain: instructional
    task_fit: narration/caption metadata for multimodal schema; video is YouTube (link-rotted)
    priority: 50
    raw_gb: 6.0                    # the caption/metadata CSVs; not the video
    cache_gb_pooled: 0.0
    recommended_subsets: []
    license: "metadata for research; videos under per-video YouTube license"
    citation: "Miech et al., HowTo100M, ICCV 2019"
    allowed_use: metadata/captions for research; no bulk video scraping
    auth_steps: "download the caption CSVs from the project page"
    download_method: http
    resume_method: per-file manifest
    checksum_plan: sha256 of each CSV
    status: metadata-only
    risk: {license: medium, size: low, link_rot: high, annotation_quality: medium, privacy: low, decode: na}
    output_layout: annotation-csv
    kind: metadata-only

  # ---------------- audio / video ----------------
  - slug: audioset_meta
    name: AudioSet (metadata)
    modality: audio-video
    domain: audio-events
    task_fit: audio/video labels + segment CSVs for the multimodal schema; video is YouTube
    priority: 45
    raw_gb: 1.0
    cache_gb_pooled: 0.0
    recommended_subsets: []
    license: "CC BY 4.0 (labels/ontology); videos under per-video YouTube license"
    citation: "Gemmeke et al., AudioSet, ICASSP 2017"
    allowed_use: labels/ontology freely usable; no bulk video scraping
    auth_steps: "download the segment CSVs and ontology JSON"
    download_method: http
    resume_method: per-file manifest
    checksum_plan: sha256 of each CSV/JSON
    status: metadata-only
    risk: {license: medium, size: low, link_rot: high, annotation_quality: medium, privacy: low, decode: na}
    output_layout: annotation-csv
    kind: metadata-only

  # ---------------- image / text auxiliary (diagnostics only) ----------------
  - slug: laion_tiny_meta
    name: LAION (tiny filtered metadata)
    modality: image-text
    domain: web-image-text
    task_fit: tiny filtered image-text sample for diagnostics only; NOT a video source
    priority: 10
    raw_gb: 0.5
    cache_gb_pooled: 0.0
    recommended_subsets: []
    license: "CC BY 4.0 (metadata); images under their own licenses; LAION-5B re-release gated"
    citation: "Schuhmann et al., LAION-5B, NeurIPS 2022"
    allowed_use: tiny filtered metadata only; respect the gated re-release
    auth_steps: "use the safety-reviewed re-release; do not bulk-fetch images"
    download_method: http
    resume_method: per-file manifest
    checksum_plan: sha256 of the metadata shard
    status: blocked                # LAION-5B was withdrawn for a safety-reviewed re-release
    risk: {license: high, size: low, link_rot: high, annotation_quality: low, privacy: high, decode: na}
    output_layout: parquet-metadata
    kind: auxiliary

  # ---------------- synthetic / control (generated locally, no download) ----------------
  - slug: synthetic_controls
    name: Synthetic control corpus
    modality: video
    domain: controlled
    task_fit: deterministic controls + rehearsal + regression fixtures (moving/occlusion/permanence/...)
    priority: 100                  # always selectable; generated locally, zero license risk
    raw_gb: 0.5
    cache_gb_pooled: 0.02
    recommended_subsets: [32, 64, 128]
    license: "generated locally (no third-party license)"
    citation: "this repo, devsys.studio.controls"
    allowed_use: unrestricted (we generated it)
    auth_steps: none
    download_method: generate       # the ONLY method that truly runs on-device without a download
    resume_method: deterministic by seed; regenerate is idempotent
    checksum_plan: per-clip sha256 (clip_hash) recorded
    status: available
    risk: {license: none, size: low, link_rot: none, annotation_quality: high, privacy: none, decode: none}
    output_layout: class-folder
    kind: structured-synthetic

  # ---------------- local user data import lane ----------------
  - slug: local_import
    name: Local class-folder import
    modality: video
    domain: user-provided
    task_fit: user drops <class>/<clip>.mp4; validated, hashed, manifested, cached
    priority: 95
    raw_gb: 0.0                     # whatever the user provides; sized at validate time
    cache_gb_pooled: 0.0
    recommended_subsets: []
    license: "user-provided (user asserts rights)"
    citation: "user-supplied"
    allowed_use: as the user is licensed to use it
    auth_steps: "point --source at a local class-foldered directory"
    download_method: local-path     # nothing is downloaded; the data is already on disk
    resume_method: validate_source + per-clip hash; skip present
    checksum_plan: per-clip sha256 (clip_hash)
    status: available
    risk: {license: user, size: user, link_rot: none, annotation_quality: user, privacy: user, decode: medium}
    output_layout: class-folder
    kind: natural-video
