name: Substrate

on:
  push:
    branches: [main, agent/substrate-event-horizon]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  authoritative:
    runs-on: macos-14
    # The final clean-clone gate intentionally re-runs the full suite from an
    # exact checkout. The previous 30-minute ceiling cancelled a fully green
    # job during that last independent pass.
    timeout-minutes: 60
    env:
      SUBSTRATE_REPOSITORY_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Clean installation
        run: python -m pip install ".[dev]"
      - name: Active tests
        run: substrate test
      - name: Ruff
        run: ruff check src tests
      - name: V5 construction and admission gates
        run: |
          substrate v5 canaries
          substrate v5 pilot
          substrate v5 rehearse
      - name: Nous Closure construction and admission gates
        run: |
          substrate nous-closure preflight
          substrate nous-closure canaries
          substrate nous-closure pilot
          substrate nous-closure rehearse
          substrate nous-closure verify
      - name: Final Revision pre-freeze gates
        run: |
          substrate final-revision reproduce-null
          substrate final-revision tournament
          substrate final-revision canaries
          substrate final-revision pilot
      - name: Scientific verification
        run: substrate verify
      - name: Mutation suite
        run: |
          python - <<'PY'
          from substrate.verification import mutation_report

          report = mutation_report()
          print(f"{report['rejected']}/{report['total']} mutations rejected")
          if not report["all_rejected"]:
              raise SystemExit(f"mutation survivors: {report['survivors']}")
          PY
      - name: Artifact drift from a clean clone
        run: |
          python - <<'PY'
          from substrate.cleanclone import run

          report = run()
          print(report)
          if not report["all_pass"]:
              raise SystemExit(f"clean-clone failures: {report['failed']}")
          PY
      - name: Activation remains false
        run: |
          python - <<'PY'
          from substrate.runtime import declaration
          from substrate.v5io import ACTIVATION as V5_ACTIVATION

          activation = declaration()["activation"]
          print(f"activation={activation}, v5_activation={V5_ACTIVATION}")
          if activation is not False or V5_ACTIVATION is not False:
              raise SystemExit("activation must remain false")
          PY
