name: Substrate

on:
  push:
    branches: [main, agent/substrate-event-horizon]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  authoritative:
    runs-on: macos-14
    # The final clean-clone gate intentionally re-runs the full suite from an
    # exact checkout. The previous 30-minute ceiling cancelled a fully green
    # job during that last independent pass.
    timeout-minutes: 60
    env:
      SUBSTRATE_REPOSITORY_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Clean installation
        run: python -m pip install ".[dev]"
      - name: Active tests
        run: substrate test
      - name: Ruff
        run: ruff check src tests
      - name: V5 construction and admission gates
        run: |
          substrate v5 canaries
          substrate v5 pilot
          substrate v5 rehearse
      - name: Nous Closure construction and admission gates
        run: |
          substrate nous-closure preflight
          substrate nous-closure canaries
          substrate nous-closure pilot
          substrate nous-closure rehearse
          substrate nous-closure verify
      - name: Final Revision pre-freeze gates
        run: |
          substrate final-revision reproduce-null
          substrate final-revision tournament
          substrate final-revision canaries
          substrate final-revision pilot
      - name: Scientific verification
        run: substrate verify
      - name: Cognitive Material Genesis gates
        run: |
          substrate genesis preflight
          python -m substrate.genesis_statistics
          python -m substrate.genesis_harness
          python -m substrate.genesis_history
          python -m substrate.genesis_claims
          python -m substrate.genesis_mutations
          python -m substrate.genesis_verification
          python -m substrate.genesis_publication
          python -m substrate.genesis_continuity
          python -m substrate.genesis_tournament
      - name: Genesis mechanism canaries
        run: |
          python - <<'PY'
          from substrate import genesis_canaries

          report = genesis_canaries.run_all()
          failed = [name for name, row in report["canaries"].items() if not row["all_pass"]]
          print(f"{len(report['canaries']) - len(failed)}/{len(report['canaries'])} genesis canaries pass")
          if failed:
              raise SystemExit(f"genesis canary failures: {failed}")
          PY
      - name: Genesis instruments can still fail
        run: |
          python - <<'PY'
          import statistics

          from substrate import genesis_config as C
          from substrate import genesis_controls, genesis_reference  # noqa: F401
          from substrate.genesis_challenge import CHANCE_LEVEL, generate
          from substrate.genesis_material import build, equal_opportunity

          def score(unit, arm):
              observations = unit.observations
              channels = sorted({observation.channel for observation in observations}) or ["symbolic"]
              opportunity = equal_opportunity(
                  envelope="512MB",
                  observations=observations,
                  sensor_channels=channels,
                  operation_budget=500_000,
                  durable_write_budget=512,
              )
              material = build(arm, opportunity)
              public = unit.public()
              for observation in public.observations:
                  material.observe(observation)
              return unit.sealed.score([material.answer(probe) for probe in public.probes])

          units = 64
          error = (CHANCE_LEVEL * (1 - CHANCE_LEVEL) / units) ** 0.5
          for family in C.CHALLENGE_FAMILIES:
              batch = [generate(family, "principal", index, seed_namespace="ci") for index in range(units)]
              reference = statistics.mean(score(unit, "reference_learner") for unit in batch)
              record = statistics.mean(score(unit, "record_store_null") for unit in batch)
              z = (record - CHANCE_LEVEL) / error
              print(f"{family}: reference={reference:.3f} record={record:.3f} z={z:+.2f}")
              if reference < 0.9:
                  raise SystemExit(f"{family} is not solvable from observations; a null on it would be an artefact")
              if z > 3.5:
                  raise SystemExit(f"{family} leaks a copyable answer to the record store")
          PY
      - name: Mutation suite
        run: |
          python - <<'PY'
          from substrate.verification import mutation_report

          report = mutation_report()
          print(f"{report['rejected']}/{report['total']} mutations rejected")
          if not report["all_rejected"]:
              raise SystemExit(f"mutation survivors: {report['survivors']}")
          PY
      - name: Artifact drift from a clean clone
        run: |
          python - <<'PY'
          from substrate.cleanclone import run

          report = run()
          print(report)
          if not report["all_pass"]:
              raise SystemExit(f"clean-clone failures: {report['failed']}")
          PY
      - name: Activation remains false
        run: |
          python - <<'PY'
          from substrate.runtime import declaration
          from substrate.v5io import ACTIVATION as V5_ACTIVATION

          activation = declaration()["activation"]
          print(f"activation={activation}, v5_activation={V5_ACTIVATION}")
          if activation is not False or V5_ACTIVATION is not False:
              raise SystemExit("activation must remain false")
          PY
