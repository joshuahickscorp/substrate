schema: mop-form-substrate-campaign/v1
series: F
minimum_seeds: 5
canonical_output_root: proof/FORM_SUBSTRATE
policy:
  contract_source: registry/experiments.yaml
  contract_equality: exact registry/class/config equality for id, ordered metrics, null, and tier
  run_promotion: latest run is never trusted implicitly; its embedded contract and config must still match
  positive_promotion: a null rejection needs an independent verifier and a verdict-gate receipt
  negative_promotion: a supported null or tie needs the canonical null card and durable run receipt
  density: every canonical run must carry mop-density-block/v1 with a declared primary and non-empty cost
  operational_awareness: OA inputs stay component-wise; no composite awareness score is permitted

# Dependencies are mechanics/data prerequisites, not permission to suppress a null result.  A leg may
# still run after a prerequisite supports its null, but its interpretation must name that upstream wall.
legs:
- id: f1_form_alignment_gate
  phase: interface
  depends_on: []
  local_requirement: canonical-run
  scale_boundary: local
- id: f2_heldout_form_transfer
