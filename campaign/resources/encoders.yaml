# Encoder Set (campaign SHARED RESOURCE). SYNTHESIZED faithfully from the corpus: there is
# no Volume IV, so this is built from configs/encoder/*, SCALING.md (the flips), and
# EXPERIMENTS.md tier tags. One frozen substrate per entry; the shell reads latent_dim off
# whichever is selected, so swapping encoders is config only (no shell code change). Form:
# no em dashes or en dashes anywhere (commas, colons, parentheses only), per BLACKHOLE.md.
#
# How a leg selects one: encoder=<key> on the CLI (Hydra-style group select against
# configs/encoder/<key>.yaml). The campaign default is the pooled ViT-L; legs that need a
# bigger substrate or dense per-patch tokens override per tier (see unlocks below).

defaults:
  encoder: vjepa2_vitl_fpc64_256   # campaign default substrate (pooled, laptop, Tier C)

# Tier vocabulary (from DECISIONS.md, synthesized from Vol I Section 9 tractability):
#   C = laptop-feasible cached-latent (runs now)
#   E = environment-needed (env adapter + rented CUDA)
#   R = rented-GPU / lab-scale (disabled by default)
# Encoder tier tags reuse EXPERIMENTS.md labels (cpu-now, gpu-later, 2.1-only).

encoders:

  vjepa2_vitl_fpc64_256:
    config: configs/encoder/vjepa2_vitl_fpc64_256.yaml   # source of truth for the fields below
    role: default                  # the campaign baseline substrate
    arch: vit_large
    hf_id: facebook/vjepa2-vitl-fpc64-256
    embed_dim: 1024                # latent_dim the shell operates on (matches configs/config.yaml)
    resolution: 256
    frames_per_clip: 64
    dense: false                   # pooled token output (pool: mean)
    frozen: true                   # inference-only, never trains; cache never goes stale
    tier_tag: cpu-now
    unlocks_tier: C                # cached-latent laptop legs: E1, E2, E3, E4, E7, E8, E9, I4
    note: >-
      Default substrate. Pooled mean over tokens, 64 frames at 256px. Runs on mps today
      against cached latents (or the frozen-random synthetic fallback when no weights). This
      is what the whole Tier C cached-latent column trains against. embed_dim 1024 is the
      campaign baseline latent_dim; sizing of predictor and heads follows it automatically.

  vjepa2_vitg:
    config: configs/encoder/vjepa2_vitg.yaml
    role: larger                   # bigger substrate, Studio scale-up (SCALING.md flip 2)
    arch: vit_giant
    hf_id: facebook/vjepa2-vitg-fpc64-384
    embed_dim: 1408                # wider latent: shell resizes off this with no code change
    resolution: 384
    frames_per_clip: 64
    dense: false
    frozen: true
    tier_tag: gpu-later
    unlocks_tier: E                # rented single GPU for scale and speed (separate compute from rep claim)
    note: >-
      Larger frozen substrate for the Mac Studio or a rented box. Same pooled interface as
      the default, just wider (1408) at 384px. Selected as encoder=vjepa2_vitg. Use it for
      the gpu-later side of the bank: an experiment that ties at toy ViT-L scale and wins
      here is a COMPUTE result (negative-result taxonomy entry 9), reported separately.

  vjepa21_vitb:
    config: configs/encoder/vjepa21_vitb.yaml
    role: dense_small              # cheapest dense substrate, lowers the 2.1 floor for the laptop
    arch: vit_base
    hf_id: facebook/vjepa2.1-vitb-dense
    embed_dim: 768                 # smaller pooled-equivalent dim, per-patch tokens
    resolution: 256
    frames_per_clip: 16            # 2.1 dense clips are shorter (16) than the pooled 2 encoders (64)
    dense: true                    # per-patch tokens, no pooling (pool: none)
    frozen: true
    tier_tag: 2.1-only
    unlocks_tier: C                # dense science fits the laptop; the small 2.1 brings E6 into Tier C reach
    note: >-
      V-JEPA 2.1 ViT-B dense. The corpus calls out ViT-B as good news for the laptop: it
      lowers the floor for dense-feature work so the E6 relational map (which needs per-patch
      object factorization the pooled 2 encoders threw away) can be prototyped on cached
      dense latents without the Studio. Smallest dense embed_dim (768); dense extraction is
      the storage cost, plan disk accordingly.

  vjepa21_vitl:
    config: configs/encoder/vjepa21_vitl.yaml
    role: dense_default            # the dense substrate E6 prefers at quality
    arch: vit_large
    hf_id: facebook/vjepa2.1-vitl-dense
    embed_dim: 1024                # matches the pooled ViT-L dim, but dense per-patch tokens
    resolution: 256
    frames_per_clip: 16
    dense: true
    frozen: true
    tier_tag: 2.1-only
    unlocks_tier: E                # quality dense run wants a GPU + a real cache (gpu-later side of E6)
    note: >-
      V-JEPA 2.1 ViT-L dense, the substrate the E6 dense-vs-pooled comparison prefers. Same
      latent_dim (1024) as the pooled default, so the parameter-matched flat baseline and the
      structured head are directly comparable: E6's contract is that the structured head must
      beat the flat baseline AND the gain on 2.1 dense must exceed the gain on pooled 2,
      otherwise the latent lacked the object factorization (taxonomy entries 3 and 8).

# Cross-reference: SCALING.md flips device mps -> cuda (flip 1) and encoder
# vjepa2_vitl -> vjepa2_vitg (flip 2); real latent caching (flip 3) flips the store backend
# from frozen_random to vjepa_hf / vjepa_hub. The dense 2.1 encoders are the only ones with
# dense: true, which is exactly what E6 (2.1-only) consumes.
