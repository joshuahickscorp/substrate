# Encoder Set (campaign SHARED RESOURCE). SYNTHESIZED faithfully from the corpus: there is
# no Volume IV, so this is built from configs/encoder/*, SCALING.md (the flips), and
# EXPERIMENTS.md tier tags. One frozen substrate per entry; the shell reads latent_dim off
# whichever is selected, so swapping encoders is config only (no shell code change). Form:
# no em dashes or en dashes anywhere (commas, colons, parentheses only), per BLACKHOLE.md.
#
# How a leg selects one: encoder=<key> on the CLI (Hydra-style group select against
# configs/encoder/<key>.yaml). The campaign default is the pooled ViT-L; legs that need a
# bigger substrate or dense per-patch tokens override per tier (see unlocks below).

defaults:
  encoder: vjepa2_vitl_fpc64_256   # campaign default substrate (pooled, laptop, Tier C)

# Tier vocabulary (from DECISIONS.md, synthesized from Vol I Section 9 tractability):
#   C = laptop-feasible cached-latent (runs now)
#   E = row-specific evidence beyond the bounded local adapter
#   R = rented-GPU / lab-scale (disabled by default)
# Encoder tier tags reuse EXPERIMENTS.md labels. Archived inherited-scale controls are historical
# evidence, not selectable campaign resources.

encoders:

  vjepa2_vitl_fpc64_256:
    config: configs/encoder/vjepa2_vitl_fpc64_256.yaml   # source of truth for the fields below
    role: default                  # the campaign baseline substrate
    arch: vit_large
    hf_id: facebook/vjepa2-vitl-fpc64-256
    embed_dim: 1024                # latent_dim the shell operates on (matches configs/config.yaml)
    resolution: 256
    frames_per_clip: 64
    dense: false                   # pooled token output (pool: mean)
    frozen: true                   # inference-only, never trains; cache never goes stale
    tier_tag: cpu-now
    unlocks_tier: C                # cached-latent laptop legs: E1, E2, E3, E4, E7, E8, E9, I4
    note: >-
      Default substrate. Pooled mean over tokens, 64 frames at 256px. Runs on mps today
      against cached latents (or the frozen-random synthetic fallback when no weights). This
      is what the whole Tier C cached-latent column trains against. embed_dim 1024 is the
      campaign baseline latent_dim; sizing of predictor and heads follows it automatically.

  vjepa21_vitb:
    config: configs/encoder/vjepa21_vitb.yaml
    role: dense_small              # cheapest dense substrate, lowers the 2.1 floor for the laptop
    arch: vit_base
    source: official_pytorch_checkpoint
    hub_entrypoint: vjepa2_1_vit_base_384
    embed_dim: 768                 # smaller pooled-equivalent dim, per-patch tokens
    resolution: 384
    frames_per_clip: 64
    dense: true                    # per-patch tokens, no pooling (pool: none)
    frozen: true
    tier_tag: weights-needed
    unlocks_tier: C                # dense science fits the laptop; the small 2.1 brings E6 into Tier C reach
    note: >-
      Meta released V-JEPA 2.1 ViT-B dense as an official PyTorch checkpoint on 2026-03-16.
      The pinned source and 1.664 GB object metadata now preflight locally; real availability
      remains false until full-byte hashing, strict ema_encoder load, and a finite forward pass.
      Start with this 80M variant, serially, and keep E6 scientific promotion behind a citable
      natural-video dense cache plus its matched controls.

  vjepa21_vitl:
    config: configs/encoder/vjepa21_vitl.yaml
    role: dense_default            # the dense substrate E6 prefers at quality
    arch: vit_large
    source: official_pytorch_checkpoint
    hub_entrypoint: vjepa2_1_vit_large_384
    embed_dim: 1024                # matches the pooled ViT-L dim, but dense per-patch tokens
    resolution: 384
    frames_per_clip: 64
    dense: true
    frozen: true
    tier_tag: weights-needed
    unlocks_tier: C                # only after the smaller ViT-B locally strict-loads and forwards
    note: >-
      The official ViT-L checkpoint exists, but acquisition and execution are gated behind a
      passing current-host ViT-B strict-load and forward receipt. Same latent_dim (1024) as the
      pooled default, so it remains a later matched E6 comparison, not the first integration rung.

# Cross-reference: SCALING.md treats device and encoder scale as measured choices, not tier proof;
# real latent caching flips the store backend
# from frozen_random to a citable real backend. The dense 2.1 encoders are the only ones with
# dense: true, which is exactly what E6 (2.1-only) consumes.
