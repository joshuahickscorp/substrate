[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devsys"
version = "0.1.0"
description = "Developmental continual-learning system around a frozen V-JEPA perceptual substrate"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4",
  "numpy>=1.26",
  "omegaconf>=2.3",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
  "faiss-cpu>=1.8",
]

[project.optional-dependencies]
# Real encoder weights (deferred path). Lazy-imported; never required for tests.
encoder = ["transformers>=4.44", "huggingface-hub>=0.24"]
# Alt ANN index, fallback to the faiss/brute-force path.
ann = ["hnswlib>=0.8"]
# Apple Silicon throughput experiment (optional, not on the hot path; see APPLE_SILICON.md).
apple = ["mlx>=0.18; platform_machine == 'arm64' and sys_platform == 'darwin'"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
devsys = "devsys.harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/devsys"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E741", "B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
disable_error_code = ["import-untyped", "no-redef"]
files = ["src/devsys"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
