[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "substrate"
version = "4.0.0a1"
description = "Local developmental cognition, reversible learning and one unrun Odyssey"
requires-python = ">=3.11"
dependencies = ["cryptography>=46"]

[project.optional-dependencies]
dev = ["pytest>=8"]
learn-apple = ["mlx-lm; sys_platform == 'darwin'"]
tensors = ["numpy>=1.26", "safetensors>=0.4"]

[project.scripts]
substrate = "substrate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/substrate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
