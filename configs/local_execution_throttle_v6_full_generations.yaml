# Local execution throttle policy v6 for the Generation 1 full-generations wave.
#
# Derived verbatim from configs/local_execution_throttle_v5_opportunistic.yaml. The sealed
# policy loader (mop.studio.local_throttle.load_policy) hard-requires the full canonical
# p4/p5/p6 task set with exact commands, the exact execution_order and dependency chains, the
# reviewed thresholds, a registered hardware profile whose max_wall_min is 300 and free-disk
# floor is 40 GB (only m3pro-local-max qualifies), and maximum_active_lanes == 2. Those are
# therefore retained unchanged; only additive full-generations compute task declarations are
# appended at the end of the tasks map below.
#
# The wave floats a dynamic idle-host pool from one to twenty workers (ceiling IDLE_WORKERS = 20). The
# Hawking known_heavy_markers are retained verbatim, so deterministic backoff-to-zero still
# arms when a Hawking doctor_v5 / quantize-model-block-parallel process reappears. The wave
# compute tasks deliberately omit external_coexistence, so they are never added to the
# coexistence whitelist: they are strictly idle-host-only and admit zero workers while any
# unmanaged heavy process (including Hawking) is visible.
schema: mop-local-execution-throttle-policy/v1
profile: m3pro-local-max
execution_order:
  p5_cpu:
  - p5smoke_cpu
  - p5_traingrid_memory_probe_cpu
  - p5pilot_cpu
  - p5fresh_challenge_cpu
  - p5verify_cpu
  p5_pilot_null_cpu:
  - p5smoke_cpu
  - p5_traingrid_memory_probe_cpu
  - p5pilot_cpu
  - p5verify_pilot_null_cpu
  p5_terminal_null_cpu:
  - p5smoke_cpu
  - p5verify_smoke_null_cpu
  p6_cpu:
  - p6_10k_resource_probe_cpu
  - p6_10k_replication_cpu
  - p6_10k_verify_cpu
  - p6_100k_replication_cpu
  - p6_100k_verify_cpu
  - p6_1m_replication_cpu
  - p6_1m_verify_cpu
  escs_substrate_cpu:
  - p5verify_cpu
  - edcm1_official_cpu
  - edcm1_verify_cpu
  - escs_x0_official_cpu
  - escs_x0_verify_cpu
limits:
  hard_wall_minutes: 300
  disk_floor_gb: 40.0
  forecast_uncertainty_fraction: 0.25
  minimum_write_reserve_gb: 0.5
  minimum_unified_memory_headroom_gb: 2.0
  minimum_mps_headroom_gb: 1.0
  maximum_active_lanes: 2
  maximum_heavy_lanes: 1
monitor:
  sample_interval_seconds: 15.0
  admission_good_samples: 3
  pause_bad_samples: 2
  resume_good_samples: 3
  cooldown_seconds: 60.0
  graceful_stop_seconds: 30.0
  require_memory_pressure: true
  require_thermal: true
  require_power: true
  foreground_markers:
  - Blender
  - Final Cut Pro
  - DaVinci Resolve
  - Adobe Premiere
  - HandBrake
  known_heavy_markers:
  - cache_factorized_encoder.py
  - cache_real_encoder.py
  - custom_substrate_workbench.py
  - p4_capability_density.py
  - p5_context_capability.py
  - p5_context_fresh_challenge.py
  - p5_traingrid_memory_probe.py
  - continual_million_event_rung.py
  - run_edcm1_event_triggered_coalition.py
  - run_escs_x0_event_formation.py
  - run_escs_x1_dispatch.py
  - generation1_cognitive_corpus.py
  - verify_generation1_cognitive_corpus.py
  - generation1_context_routing/run_shard.py
  - generation1_context_routing/aggregate.py
  - generation1_context_routing/verify.py
  - mop_generation1_successor_horizon.py
  - run_shard.py
  - aggregate.py
  - verify.py
  - build_generation1_report.py
  - run_ecology_scaffold_batteries.py
  - verify_ecology_scaffold_batteries.py
  - run_integrity_scaffold_drills.py
  - verify_integrity_scaffold_drills.py
  - run_material_twin_batteries.py
  - verify_material_twin_batteries.py
  - run_integration_broadcast.py
  - verify_integration_broadcast.py
  - run_sensing_scaffold.py
  - verify_sensing_scaffold.py
  - run_escs_g0_formation_study.py
  - p7_action_world_model_preflight.py
  - p9_causal_monitoring_preflight.py
  - tools/condense/audit_ladder.py
  - tools/condense/doctor.py
  - tools/condense/doctor_v5_qwen_treatment_adapter.py
  - tools/condense/doctor_v5_strand_ladder_adapter.py
  - tools/condense/doctor_v5_qwen_treatment_block_parallel_adapter.py
  - tools/condense/doctor_v5_strand_ladder_block_parallel_adapter.py
  - tools/condense/doctor_v5_sharded_eval.py
  - vendor/strand-quant/target/release/quantize-model
  - build/strand-block-parallel/release/quantize-model-block-parallel
  - vendor/strand-decode-kernel/target/release/attest-strand
  - vendor/strand-decode-kernel/target/release/archive-to-safetensors
  - bin/hf download
  - bin/hf cache verify
  - computexchange/agent/target/release
thresholds:
  first_lane:
    maximum_load_per_logical_cpu: 0.95
    maximum_cpu_utilization_fraction: 0.95
    minimum_memory_available_percent: 12.0
    maximum_swap_used_gb: 8.0
  second_lane:
    maximum_load_per_logical_cpu: 0.45
    maximum_cpu_utilization_fraction: 0.45
    minimum_memory_available_percent: 45.0
    maximum_swap_used_gb: 2.0
  external_coexistence:
    minimum_memory_available_percent: 12.0
    minimum_memory_available_gb: 8.0
    minimum_memory_pressure_free_percent: 40.0
    maximum_swap_used_gb: 4.0
tasks:
