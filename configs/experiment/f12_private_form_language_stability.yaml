id: f12_private_form_language_stability
name: private_form_language_stability
module: f_form_substrate
metric: [cross_seed_code_transfer, code_agreement, random_code_floor]
null_hypothesis: "cross-seed code agreement ties the random-codebook floor and probe transfer is at chance"
tier: cpu-now

samples: 300
classes: 5
codebook_k: 5
world_dim: 20
feature_dim: 24
separation: 1.6
world_noise: 0.5
form_noise: 0.3
base_seed: 999
train_frac: 0.6
epochs: 120
lr: 0.05
margin: 0.15
transfer_margin: 0.1
seeds: [0, 1, 2]
