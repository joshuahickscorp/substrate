id: y2_basin_stability
name: basin_stability
module: y_dynamics
metric: [sensitivity_coefficient, contraction_ratio, perturbed_acc_vs_raw]
null_hypothesis: "the refiner shows no basin structure (sensitivity near 1) or amplifies noise without helping perturbed accuracy"
tier: cpu-now

dim: 40
n_classes: 4
samples: 200
separation: 2.0
hidden: 48
trained_steps: 4
unroll_steps: 48
epsilon_grid: [0.05, 0.1, 0.2, 0.4]
basin_eps: 0.2
acc_margin: 0.02
epochs: 70
lr: 0.01
seeds: [0, 1]
