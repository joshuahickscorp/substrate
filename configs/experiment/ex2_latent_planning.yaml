id: ex2_latent_planning
name: latent_planning_mpc_synthetic
module: ex2_latent_planning
metric: [goal_success, goal_distance_reduction, rollout_error]
null_hypothesis: "the learned dynamics does not enable planning the flat shell cannot do, or rollout error is too high to plan against"
tier: cpu-now

# SCALED default (real minutes on CPU, not a toy). Synthetic-arm-only precursor: see the module
# docstring in src/mop/experiments/ex2_latent_planning.py for the scope cut (live-environment
# planning stays deferred, Tier R).
seed: 0

# latent / action dimensionality: a real (not toy) size for the synthetic action-conditioned system
dim: 32
action_dim: 8

# dynamics model + fitting
hidden: 256
epochs: 300
lr: 0.001
n_train_transitions: 4000
nonlinearity: 0.5
noise: 0.02
rollout_k: 8

# goal-reaching trial budget
n_trials: 200

# short-horizon MPC / CEM shooting search
horizon: 8
n_shooting_samples: 400
cem_iters: 3
cem_elite_frac: 0.1

# gates and margins (never tuned toward a positive; these are fixed floors/margins, not fit to the data)
# success = terminal distance to goal < success_frac_of_start * the trial's own start distance
# (scale-invariant across dim/action_dim, rather than a fixed absolute magic number)
success_frac_of_start: 0.5
planning_margin: 0.05
r2_floor: 0.5
