# E7: sparse / modular developmental predictor. Interference reduction at MATCHED params.
# Three head variants (dense, k-WTA, MoE) trained sequentially on a domain-incremental stream.
# Null: no sparse/modular head beats parameter-matched dense on BWT. Speedup is a separate,
# gpu-later, not-required claim. Tier: cpu-now.
id: e7_sparse
name: sparse_modular_predictor
module: e7_sparse
metric: [backward_transfer, forgetting, routing_entropy, wall_clock_s]
null_hypothesis: "no sparse or modular head beats the parameter-matched dense head on backward transfer; any reduction was just capacity (speedup reported separately, gpu-later, not required)"
tier: cpu-now

stream:
  incremental: domain     # shared labels, geometry rotates per domain => reliable interference
  n_tasks: 5
  dim: 128
  classes_per_task: 6     # shared label space across domains; overlap forces forgetting
  samples_per_task: 256
  separation: 0.5         # low separation => cross-domain overlap => interference

hidden: 64                # dense/k-WTA hidden width; MoE expert widths are matched to this
kwta_k: 8                 # top-k active hidden units in the k-WTA head
n_experts: 4              # MoE experts behind the softmax router
epochs_per_task: 60
lr: 0.01
margin: 0.02              # a sparse arm must beat dense BWT by this to reject the null
