id: ex12_atlas
name: representational_atlas
module: ex12_atlas
metric: [probe_accuracy_above_chance, effective_rank, anisotropy, cka_vs_random]
null_hypothesis: "probe accuracy does not exceed the shuffle-label floor for a factor (the factor is not in the latent)"
tier: cpu-now

# the atlas toy: a known-decodable factor (identity) and a known non-decodable factor (random label),
# each probed linearly and nonlinearly with a shuffle-label chance floor, plus the geometry battery
dim: 64
n_classes: 4
samples: 320
separation: 2.0
seeds: [0, 1, 2]
