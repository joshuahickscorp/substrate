id: ex10_cross_modal
name: cross_modal_binding_synthetic
module: ex10_cross_modal
metric: [cross_modal_transfer, binding_gain, shuffled_pairing_gap]
null_hypothesis: "a cross-modal predictor binding two synthetic modalities of the same underlying labels does not improve retention or abstraction over a single-modality control; the modalities are not aligned enough to bind, or the auxiliary objective is just a regularizer"
tier: cpu-now

# toy scale (seconds on cpu). SYNTHETIC precursor arm of the deferred natural audio-video ex10.
dim: 40
n_classes: 4
n_domains: 4
samples: 200
separation: 2.0
hidden: 48
epochs: 60
lr: 0.01
aux_weight: 0.5
margin: 0.02
transfer_margin: 0.05
seeds: [0, 1, 2]
