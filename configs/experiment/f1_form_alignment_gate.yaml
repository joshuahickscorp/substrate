id: f1_form_alignment_gate
name: form_alignment_gate
module: f_form_substrate
metric: [aligned_transfer, raw_transfer, shuffled_anchor_transfer]
null_hypothesis: "paired referent alignment fails to beat the strongest raw, moment-matched, or shuffled-anchor control by the preregistered margin, or remains near chance"
tier: cpu-now

samples: 420
classes: 8
world_dim: 28
feature_dim: 30
separation: 0.9
world_noise: 1.1
form_noise: 0.55
anchor_frac: 0.25
label_frac: 0.35
source_form: vision
target_form: audio
epochs: 70
lr: 0.03
margin: 0.05
chance_band: 0.10
seeds: [0, 1, 2, 3, 4]
