# MoT preregistration mirror (WP-02): registry row mop_mt8_latent_debate in registry/experiments.yaml.
# The null_hypothesis is carried VERBATIM from the registry row (which mirrors section 11 of
# docs/mixture_of_perspectives/11_experiment_registry.md). This row runs as a standalone script
# (status registry-only), not through mop.experiments.REGISTRY: scripts/mop_mt8_latent_debate.py
# writes its verdict json to runs/mot/mt8_latent_debate.json.
id: mop_mt8_latent_debate
name: latent_debate_vs_single_module
module: scripts/mop_mt8_latent_debate.py
metric: [error_at_matched_total_flops]
null_hypothesis: "debate ties the single matched module AND ties a plain ensemble; structured exchange is an unrolled ensemble/MoE"
