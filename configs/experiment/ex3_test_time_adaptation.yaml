id: ex3_test_time_adaptation
name: test_time_adaptation
module: ex3_test_time_adaptation
metric: [shift_acc_tta, shift_acc_frozen, base_retention_after_revert]
null_hypothesis: "TTA does not beat the frozen head on the shifted domain at matched parameters"
tier: cpu-now

dim: 64
n_classes: 4
samples: 320
separation: 1.5     # lower separation -> a genuine domain shift to adapt to
hidden: 64
epochs: 120
lr: 1.0e-3
tta_lr: 1.0e-2
tta_steps: 30
margin: 0.03
seeds: [0, 1, 2]
