id: mop_cm7_min_objective_probe
name: minimum_objective_encoder_probe
module: custom_substrate
metric: [nuisance_invariance_per_objective, held_out_combo_per_objective]
null_hypothesis: "at matched tiny capacity, matched data, matched 256px, both custom objectives tie random-init same-arch AND tie each other; objective is not a lever at this scale and the +0.31 was scale/data/architecture/resolution. A tie is a strong negative closing the custom-encoder line"
tier: cpu-now

requirements_ledger: configs/custom_substrate/requirements.yaml
strict_requirements: true

# This default is a bounded 256px one-seed execution suitable for the normal experiment harness.
# mop cm7 --profile local180 expands it to five seeds and an interruptible
# 180-minute wall envelope without changing the scientific contract.
data:
  resolution: 256
  frames: 8
  factor_a_levels: 4
  factor_b_levels: 4
  replicates: 3
  seed: 4407

model:
  dim: 128
  depth: 4
  heads: 4
  mlp_ratio: 4
  patch_size: 32
  tubelet: 2
  max_resolution: 256
  max_frames: 8

training:
  objectives: [predictive, invariance, reconstruction, random_target]
  seeds: [0]
  steps: 3
  batch_size: 2
  eval_batch_size: 4
  learning_rate: 0.0005
  weight_decay: 0.02
  mask_ratio: 0.50
  ema_decay: 0.99
  variance_weight: 0.10
  checkpoint_every: 1
  wall_budget_seconds: 240.0
  min_free_disk_gb: 40.0

# The teacher is an optional citable cache control. No inherited encoder package or weight is loaded
# by CM7, and the four mandatory arms remain fully runnable if this cache is absent.
teacher:
  cache_path: data/cache/vjepa2_vitl_local8_citable

promotion:
  min_params: 1000000
  max_params: 5000000
  min_seeds: 5
  margin: 0.03
  ceiling: 0.98
  compute_tolerance: 0.005
  teacher_min_rows: 64
