id: d5_lp_self_curriculum
name: lp_self_curriculum_developmental_order
module: d_developmental
metric: [entry_order_difficulty_rank_corr, final_acc_by_ordering, noisy_tv_rejected]
null_hypothesis: "LP-ordering ties random ordering on final accuracy and LP entry order is uncorrelated with measured family difficulty"
tier: cpu-now

dim: 40
n_families: 5
n_classes: 3
samples_per_family: 120
sep_hi: 3.0
sep_lo: 0.6
epochs: 30
lr: 0.05
tv_steps: 60
margin: 0.03
corr_threshold: 0.3
seeds: [0, 1]
