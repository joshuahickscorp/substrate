# MoT preregistration mirror (WP-02): registry row mop_al1_uncertainty_router in registry/experiments.yaml.
# The null_hypothesis is carried VERBATIM from the registry row (which mirrors section 11 of
# docs/mixture_of_perspectives/11_experiment_registry.md). This row runs as a standalone script
# (status registry-only), not through mop.experiments.REGISTRY: scripts/mop_al1_uncertainty_router.py
# writes its verdict json to runs/mot/al1_uncertainty_router.json.
id: mop_al1_uncertainty_router
name: uncertainty_router_with_noisy_tv_guard
module: scripts/mop_al1_uncertainty_router.py
metric: [adaptation_per_update, noisy_tv_pass]
null_hypothesis: "the uncertainty router matches random episode selection on adaptation-per-update, OR it chases irreducible aleatoric noise (fails the noisy-TV guard), replicating the e4 negative in router clothing"
falsifier: "router == random selection, or fails noisy-TV"
tier: cpu-now
seeds: '0-4'
output: runs/mot/al1_uncertainty_router.json
pilot: false
