# MoT preregistration mirror (WP-02): registry row mop_at1_nuisance_grid in registry/experiments.yaml.
# The null_hypothesis is carried VERBATIM from the registry row (which mirrors section 11 of
# docs/mixture_of_perspectives/11_experiment_registry.md). This row runs as a standalone script
# (status registry-only), not through mop.experiments.REGISTRY: scripts/mop_at1_grid_pilot.py
# writes its verdict json to runs/mot/at1_grid_pilot.json.
# PILOT: laptop-scale evidence only; the registered claim needs studio-scale
# (see the row's relation field and STUDIO_HANDOFF.md).
id: mop_at1_nuisance_grid
name: cross_substrate_nuisance_grid
module: scripts/mop_at1_grid_pilot.py
metric: [per_substrate_decodability_delta_over_random_init]
null_hypothesis: "every substrate's decodability delta over its matched-resolution random-init control is within seed spread (random-control-artifact): pretraining bought no nuisance invariance beyond architecture and resolution in any substrate"
falsifier: "all deltas < seed spread over random-init"
tier: cpu-now
seeds: '0-4'
output: runs/mot/at1_grid_pilot.json
pilot: true
