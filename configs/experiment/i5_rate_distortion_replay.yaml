id: i5_rate_distortion_replay
name: rate_distortion_replay
module: i_infotheory
metric: [rate_distortion_curve, bits_saved_at_fixed_bwt, area_under_rd_curve]
null_hypothesis: "importance-weighted allocation lies on the same RD curve as uniform within seed spread, or the curve is a flat cliff"
tier: cpu-now

dim: 32
n_tasks: 3
classes_per_task: 2
samples: 120
separation: 2.0
uniform_bits: [2, 4, 8]
alloc_low_bits: 2
alloc_high_bits: 8
flat_margin: 0.02
saved_margin: 8.0
epochs: 40
lr: 0.02
seeds: [0, 1]
