# MoT preregistration mirror (WP-02): registry row mot_pr4_epistemic_gate in registry/experiments.yaml.
# The null_hypothesis is carried VERBATIM from the registry row (which mirrors section 11 of
# docs/mixture_of_thinking/11_experiment_registry.md). This row runs as a standalone script
# (status registry-only), not through devsys.experiments.REGISTRY: scripts/mot_pr4_epistemic_gate.py
# writes its verdict json to runs/mot/pr4_epistemic_gate.json.
id: mot_pr4_epistemic_gate
name: epistemic_gate_vs_noisy_tv
module: scripts/mot_pr4_epistemic_gate.py
metric: [reducible_vs_noise_lr_integral, noisy_tv_pass]
null_hypothesis: "on the noisy-TV split the disagreement gate allocates no more LR-integral (or query budget) to the reducible partition than an ungated arm: replicates the e4 epistemic/aleatoric conflation"
falsifier: "reducible-vs-noise LR-integral allocation delta <= 0"
tier: cpu-now
seeds: '0-4'
output: runs/mot/pr4_epistemic_gate.json
pilot: false
