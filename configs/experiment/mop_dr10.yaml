# MoT preregistration mirror (WP-02): registry row mop_dr10_retrieve_reason in registry/experiments.yaml.
# The null_hypothesis is carried VERBATIM from the registry row (which mirrors section 11 of
# docs/mixture_of_perspectives/11_experiment_registry.md). This row runs as a standalone script
# (status registry-only), not through mop.experiments.REGISTRY: scripts/mop_dr10_retrieve_reason.py
# writes its verdict json to runs/mot/dr10_retrieve_reason.json.
id: mop_dr10_retrieve_reason
name: memory_first_retrieve_then_reason
module: scripts/mop_dr10_retrieve_reason.py
metric: [few_shot_accuracy, adaptation_speed]
null_hypothesis: "retrieval ties from-scratch OR ties random retrieval: the frozen neighbor metric is not task-aligned"
falsifier: "retrieval <= max(from-scratch, random-retrieval)"
tier: cpu-now
seeds: '0-4'
output: runs/mot/dr10_retrieve_reason.json
pilot: false
