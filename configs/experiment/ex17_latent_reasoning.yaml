id: ex17_latent_reasoning
name: latent_iterative_reasoning
module: ex17_latent_reasoning
metric: [accuracy, gain_vs_compute_matched, params_ratio, halting_steps]
null_hypothesis: "at matched compute the iterative refiner ties the untied-depth control (iteration was just depth)"
tier: cpu-now

# the latent-reasoning toy: a single multiclass latent task; tied refiner vs untied-depth control at matched FLOPs
dim: 64
hidden: 96
steps: 4
n_classes: 4
samples: 320
separation: 2.0
epochs: 120
lr: 1.0e-3
margin: 0.05          # accuracy tie band: |refiner - control| <= margin means the null holds
adaptive_halt: false  # set true to exercise confidence-based halting (reports mean halting steps)
seeds: [0, 1, 2]
