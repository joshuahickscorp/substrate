# MoT preregistration mirror (WP-02): registry row mop_dr8_fixed_point in registry/experiments.yaml.
# The null_hypothesis is carried VERBATIM from the registry row (which mirrors section 11 of
# docs/mixture_of_perspectives/11_experiment_registry.md). This row runs as a standalone script
# (status registry-only), not through mop.experiments.REGISTRY: scripts/mop_dr8_fixed_point.py
# writes its verdict json to runs/mot/dr8_fixed_point_vjepa.json.
id: mop_dr8_fixed_point
name: recurrent_refinement_fixed_point_vs_drift
module: scripts/mop_dr8_fixed_point.py
metric: [update_norm_decay_curve, past_horizon_loss]
null_hypothesis: "update norms do not decay geometrically and unrolling past N worsens loss: no fixed point, it is unrolled depth (the n9/y1 result)"
falsifier: "no geometric decay; loss rises past N"
tier: cpu-now
seeds: '0-4'
output: runs/mot/dr8_fixed_point_vjepa.json
pilot: false
