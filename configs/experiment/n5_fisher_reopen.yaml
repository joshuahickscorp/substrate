id: n5_fisher_reopen
name: fisher_triggered_plasticity_reopening
module: n_neuro_replay_reasoning
metric: [frontier_auc_after_shift, adaptation_speed, shift_localization_acc]
null_hypothesis: "triggered reopening ties tuned cosine decay (an LR trick), or the Fisher signal fails to localize the shift (estimator too weak)"
tier: cpu-now

dim: 40
n_chunks: 9
samples_per_chunk: 64
classes_per_task: 4
separation: 2.0
epochs: 30
lr: 0.05
fisher_z: 0.5
reopen_window: 2
localize_tol: 1
seeds: [0, 1]
