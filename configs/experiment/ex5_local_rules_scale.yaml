# EX5: local learning rules at scale, extending I4 to retention (backward transfer) on a
# genuine domain-incremental continual stream. Persistent (not from-scratch-per-task) versions
# of exactly three rules (backprop, feedback_alignment, predictive_coding) are each trained
# incrementally across n_tasks tasks with the SAME carried-forward weights, matched hidden
# width and epoch budget, then compared on accuracy_gap, activation_memory, locality, and
# backward_transfer. A depth-sweep control repeats the whole comparison at each width in
# hidden_widths to check whether any rule's relative BWT advantage survives a capacity change.
# Tier: cpu-now.
#
# THIS IS THE SCALED DEFAULT (designed to take real minutes on a CPU laptop, not a toy stub;
# the registry tags this experiment resource_tier=studio-scale from its original frontier-
# compute design, but this build runs the real mechanism now, just slower). For a fast dev-loop
# iteration (seconds, self-test/CI scale), override on the command line or in compose(), e.g.:
#   devsys.config.compose(["experiment=ex5_local_rules_scale", "device=cpu",
#     "experiment.n_tasks=4", "experiment.dim=16", "experiment.classes_per_task=3",
#     "experiment.samples_per_task=24", "experiment.hidden_widths=[8,16]",
#     "experiment.epochs_per_task=3", "experiment.n_anchors=3", "experiment.seeds=[0]"])
id: ex5_local_rules_scale
name: local_rules_at_scale
module: ex5_local_rules_scale
metric: [accuracy_gap, activation_memory, locality, backward_transfer]
null_hypothesis: "no local rule comes within the accuracy margin of backprop AND none offers a continual-learning or memory advantage that justifies the gap"
tier: cpu-now

# --- scaled default: genuinely "at scale" for a CPU laptop, minutes not seconds ---
# MEASURED (not just extrapolated) on an M-series CPU laptop: this exact shipped config
# (n_tasks=80, hidden_widths=[32,64,96], epochs_per_task=80, seeds=[0,1,2]) ran end to end
# in ~112 real seconds (~1.9 minutes). For reference, a smaller run at n_tasks=50,
# epochs_per_task=30, 1 seed took ~9-10 real seconds; epochs_per_task scales wall-clock
# roughly linearly (~2x wall-clock for 2x epochs), which is most of the gap between the two.
n_tasks: 80                # domain-incremental continual stream length
dim: 48
classes_per_task: 4        # shared label space across all tasks (domain-incremental)
samples_per_task: 80
separation: 0.6             # matches I4's difficulty knob: hard enough that gaps are real
hidden_widths: [32, 64, 96] # depth-sweep control: matched-budget comparison at each width
epochs_per_task: 80
lr: 0.05
n_anchors: 8                # anchor-task-subset trick: evaluate this many tasks per BWT read
margin: 0.03                 # "within margin of backprop" accuracy threshold
seeds: [0, 1, 2]              # multi-seed at scaled size: real minutes on CPU (see note above)
