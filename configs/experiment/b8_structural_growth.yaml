id: b8_structural_growth
name: structural_growth
module: b8_structural_growth
metric: [grown_vs_fixed_final_delta, capacity_matched, growth_events]
null_hypothesis: "a shell that grows capacity on plateau does not beat a fixed shell of the same final capacity trained the same way; any gain is just the extra capacity, not the growth process"
tier: cpu-now

# a low-separation multi-class stream so no arm sits at the accuracy ceiling: at this separation the
# small initial width (~0.5 val acc) is genuinely capacity-starved and the final width (~0.8) has real
# headroom, so growing has room to help IF the process (not just the size) matters. Keeping everyone off
# 1.0 makes grown_vs_fixed_final_delta a genuine measurement rather than a ceiling artifact.
dim: 40
n_classes: 10
samples: 500
separation: 0.22

# growth schedule: start small, add units on plateau up to the final width. w_final is what the
# fixed-final control also uses (matched-final-capacity). min_delta is small so late plateaus still
# trigger and the grown arm reliably reaches w_final (needed for a clean capacity match).
w_init: 4
w_final: 32
grow_add: 4
patience: 5
min_delta: 0.002

# same budget for every arm: all three train for `epochs` on the same data split. Enough epochs that
# the grown arm can climb the full growth ladder (w_init -> w_final) and every arm converges.
epochs: 200
lr: 0.02
seeds: [0, 1, 2]
