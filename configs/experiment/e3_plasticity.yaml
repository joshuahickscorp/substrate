# E3: critical-period schedule (staged plasticity), lever 6.1. Domain-incremental stream.
# Compare plasticity arms {constant, soft decay, hard staged, staged+triggered} on the
# adaptation-retention frontier, plus a Fisher trace for the critical-period signature.
# NULL: staged ties BOTH constant and tuned decay (the "just an LR trick" null). Tier: cpu-now.
id: e3_plasticity
name: critical_period_schedule
module: e3_plasticity
metric: [backward_transfer, frontier_auc, fisher_peak_index, staged_beats_both]
null_hypothesis: "staged plasticity ties both constant LR and tuned soft decay on the frontier (it was just an LR trick) and the frozen substrate shows no Fisher rise-then-fall sensitivity window"
tier: cpu-now

tie_margin: 0.02         # BWT gap below this counts as a tie (the null cannot be rejected)

stream:
  incremental: domain    # shared labels, geometry rotates per domain => reliable forgetting
  n_tasks: 6
  dim: 1024
  classes_per_task: 6
  samples_per_task: 256
  separation: 0.5        # low separation => cross-domain overlap => interference

train:
  epochs_per_task: 6
  batch_size: 32

head:
  hidden: 64
  depth: 2

fisher:                  # Achille/Rovere/Soatto Fisher-trace sanity check on a small head
  hidden: 32
  checkpoints: 8
  steps_per_ckpt: 10
  lr: 0.05
