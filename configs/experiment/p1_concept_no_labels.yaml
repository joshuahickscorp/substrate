id: p1_concept_no_labels
name: concept_formation_without_labels
module: p_philosophy
metric: [hidden_purity, hidden_probe_acc, delta_over_raw, delta_over_frozen_random]
null_hypothesis: "shell hidden states decode the held-out factor no better than the raw frozen latent, or the same purity appears under frozen-random (projection-invariant geometry, not concept formation)"
tier: cpu-now

dim: 40
n_classes: 4
samples: 200
separation: 2.0
hidden: 48
k_clusters: 4
kmeans_iters: 8
epochs: 60
lr: 0.01
seeds: [0, 1]
