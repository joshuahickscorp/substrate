id: p2_memorize_vs_concept
name: memorization_vs_concept_interpolation_extrapolation
module: p_philosophy
metric: [gen_gap_shell, gen_gap_nn, extrapolation_error_shell, extrapolation_error_nn]
null_hypothesis: "the shell ties the nearest-neighbor memorization baseline on held-out values (it memorized, did not form a concept), or it fails extrapolation exactly where lookup fails (no rule learned)"
tier: cpu-now

dim: 40
samples: 240
separation: 2.0
hidden: 48
slope: 1.5
bias: 0.0
band_lo: 0.3
band_hi: 0.8
extrap_ratio: 0.7
margin: 0.02
epochs: 80
lr: 0.01
seeds: [0, 1]
