id: f13_form_energy_budget
name: form_energy_budget
module: f_form_substrate
metric: [accuracy_per_byte, accuracy_per_param, estimated_energy_per_correct]
null_hypothesis: "every form interface lies on the same full-system accuracy-versus-cost frontier as raw or matched random features, so form structure buys no capability per retained byte, parameter, FLOP, or analytically estimated joule"
tier: cpu-now

samples: 480
classes: 6
world_dim: 24
feature_dim: 24
separation: 1.0
world_noise: 1.0
form_noise: 1.2
train_frac: 0.6
raw_form: vision
widths: [4, 8, 16]
token_counts: [1, 4]
shell_sizes: [0, 16]
replay_bytes: [4096, 16384]
token_noise: 0.55
epochs: 70
lr: 0.03
margin: 0.02
point_margin: 0.01
# Explicit analytical model. These coefficients produce an estimate, never measured-energy evidence.
energy_pj_per_flop: 15.0
energy_pj_per_byte: 20.0
seeds: [0, 1, 2, 3, 4]
