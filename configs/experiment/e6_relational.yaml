# E6: cache-first relational readout over official V-JEPA 2.1 ViT-B dense tokens. The registered
# path never invokes the legacy frozen-random loader. It consumes a learned/random cache pair over
# one exact tensor manifest, preserves token bins, and fails closed while those caches are absent.
id: e6_relational
name: relational_map_2_vs_21
module: e6_relational
metric: [dense_primary_delta, position_specificity_delta, scientific_promotion]
null_hypothesis: "the learned token-aware readout ties the strongest parameter-matched learned-flat, token-shuffle, or exact-architecture random-init control on held-out factor combinations"
tier: env-later

execution_path: cache-first
allow_legacy_fixture: false
cache_task_config: configs/experiment/e6_dense_cache.yaml
learned_cache: data/cache/vjepa21_vitb_e6_learned
random_cache: data/cache/vjepa21_vitb_e6_random_seed20260710
cache_readout:
  bins: 8
  feature_rank: 16
  summary_dim: 32
  ridge: 0.01
  seeds: [0, 1, 2, 3, 4]
  min_margin: 0.02
  ceiling: 0.98

samples: 192          # legacy fixture only, requires explicit allow_legacy_fixture=true
n_attr: 4             # attributes per slot; composite class space is n_attr*n_attr = 16
attr_shift: 1.5       # per-attribute clip bias so the frozen latent carries attribute info
hidden: 64            # flat head hidden width; structured head is parameter-matched to it
epochs: 120
lr: 0.01
tie_eps: 0.01         # delta must exceed this to count as beating the flat baseline (not a tie)
