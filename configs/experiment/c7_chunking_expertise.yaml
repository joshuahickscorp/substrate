id: c7_chunking_expertise
name: chunking_as_expertise
module: c_cogsci
metric: [steps_to_competence_ratio, final_accuracy_gap, delta_over_random_boundaries]
null_hypothesis: "chunked input ties uniform-window input at matched capacity, or the boundaries are not reliable enough to help"
tier: cpu-now

dim: 48
n_events: 5
frames_per_event: 8
separation: 2.0
n_sequences: 60
n_classes: 3
competence_threshold: 0.6
max_steps: 80
seeds: [0, 1]
