id: f8_plastic_substrate_rewrite
name: plastic_substrate_rewrite
module: f_form_substrate_missing
metric: [heldout_factor_acc, representation_rewrite_delta, matched_compute_delta]
null_hypothesis: "a plastic substrate fails to beat the frozen inherited, larger frozen-shell, or SSL-trained random-init controls on licensed held-out factors at a matched estimated end-to-end FLOP budget"
tier: env-later

# Smoke proves mechanics only. Scientific mode consumes a content-hashed local NPZ dataset package,
# safe executable MLP weights, an inherited-feature receipt, and all preregistered control receipts.
# A fixture package may exercise the full engine but is permanently nonpromotable.
execution_mode: smoke
evidence:
  data_rights_manifest: ""
  real_encoder_manifest: ""
  matched_compute_receipt: ""
  seed_plan_receipt: ""
  shell_failure_receipt: ""
smoke:
  seed: 0
  samples: 24
  dim: 8
  width: 6
  classes: 3
scientific:
  seeds: [0, 1, 2, 3, 4]
  batch_size: 16
  lr: 0.01
  ssl_compute_fraction: 0.5
  variance_weight: 0.2
  larger_shell_width: 0  # zero derives width from the inherited feature dimension
  larger_shell_multiplier: 2.0
  margin: 0.02
  compute_tolerance: 0.02
  max_compute_flops_per_arm_seed: 200000000
  max_package_bytes: 20000000000
  # Explicitly raise only on a measured larger host. NPZ members are checked before materialization.
  max_resident_bytes: 6000000000
  max_trainable_params: 50000000
  max_seed_count: 20
  max_total_flops: 4000000000
