id: i6_mi_audit
name: mutual_information_audit
module: i_infotheory
metric: [exploitation_ratio, mi_decodable, mi_used]
null_hypothesis: "the exploitation ratio is near 1 for every decodable factor (no headroom), or the two MI estimators disagree so the ratio is uninterpretable"
tier: cpu-now

dim: 32
n_classes: 4
samples: 200
separation: 2.0
code_clusters: 8
capacity_rungs: [8, 16, 32]
ratio_threshold: 0.9
estimator_tol: 0.5
epochs: 70
lr: 0.02
seeds: [0, 1]
