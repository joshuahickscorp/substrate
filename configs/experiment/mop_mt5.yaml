# MoT preregistration mirror (WP-02): registry row mop_mt5_adaptive_halting in registry/experiments.yaml.
# The null_hypothesis is carried VERBATIM from the registry row (which mirrors section 11 of
# docs/mixture_of_perspectives/11_experiment_registry.md). This row runs as a standalone script
# (status registry-only), not through mop.experiments.REGISTRY: scripts/mop_mt5_adaptive_halting.py
# writes its verdict json to runs/mot/mt5_adaptive_halting.json.
id: mop_mt5_adaptive_halting
name: adaptive_halting_vs_fixed_depth
module: scripts/mop_mt5_adaptive_halting.py
metric: [accuracy_vs_average_flop_frontier, halting_entropy]
null_hypothesis: "at equal average FLOPs, adaptive halting ties fixed-depth: no exploitable hardness heterogeneity, or the halt head collapses to a constant"
falsifier: "adaptive AUC <= fixed-depth at equal mean FLOPs, or halt collapses to constant N"
tier: cpu-now
seeds: '0-4'
output: runs/mot/mt5_adaptive_halting.json
pilot: false
