id: d6_sensitive_window
name: sensitive_critical_developmental_window
module: d6_sensitive_window
metric: [early_vs_late_advantage, window_effect_size, order_matters]
null_hypothesis: "there is no sensitive window: the SAME evidence presented early vs late in training produces the same final competence at matched total data, so exposure order does not shape the shell the way a developmental critical period shapes a child"
tier: cpu-now

dim: 40
n_classes: 3
n_blocks: 5
samples_per_block: 120
separation: 2.0
train_frac: 0.7
target_block: 2
early_slot: 0
late_from_end: 0
epochs: 30
lr: 0.05
window_margin: 0.05
seeds: [0, 1, 2]
