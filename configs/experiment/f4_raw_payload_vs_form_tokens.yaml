id: f4_raw_payload_vs_form_tokens
name: raw_payload_vs_canonical_form_tokens
module: f_form_substrate
metric: [cross_form_transfer_per_dim, retention_per_dim, control_delta]
null_hypothesis: "ordered canonical form tokens fail to beat the strongest raw, handcrafted, shuffled-referent, or token-order control by the preregistered margin"
tier: cpu-now

samples: 400
classes: 8
world_dim: 32
separation: 0.9
world_noise: 1.1
form_noise: 0.5
token_count: 4
token_dim: 8
token_hidden: 8
reference_form: vision
vision_channel_dim: 8
audio_channel_dim: 6
symbolic_channel_dim: 12
timeseries_channel_dim: 5
anchor_frac: 0.25
label_frac: 0.35
epochs: 70
lr: 0.03
margin: 0.05
seeds: [0, 1, 2, 3, 4]
