id: ex14_memory_bakeoff
name: memory_bakeoff
module: ex14_memory_bakeoff
metric: [recall_at_k, backward_transfer, retention_per_byte]
null_hypothesis: "associative memory does not beat FIFO capacity and uncertainty indexing ties random eviction, even at scale"
tier: cpu-now

# memory bake-off toy: FIFO vs random (reservoir) vs uncertainty-indexed eviction at MATCHED buffer
# capacity, scored on recall@k (associative KV retrieval) and two-task backward transfer (BWT)
dim: 32
capacity: 40          # matched across all three schemes
n_classes: 4
samples_per_task: 200
separation: 0.3       # low enough that domain-incremental task1 induces real forgetting on task0
k: 5                  # k-NN for recall@k
epochs: 80
lr: 1.0e-2
tie_margin: 0.05      # tie-tolerance band added on top of seed spread
seeds: [0, 1, 2]
