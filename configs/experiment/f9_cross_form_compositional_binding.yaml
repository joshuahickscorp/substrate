id: f9_cross_form_compositional_binding
name: cross_form_compositional_binding
module: f_form_substrate
metric: [heldout_combo_acc, seen_combo_acc, heldout_seen_gap]
null_hypothesis: "held-out cross-form combinations collapse toward the strongest single-form, shuffled-label, or shuffled-referent floor while seen pairs stay high, so the system did not bind factors across forms"
tier: cpu-now

# Two factors only (the 3-factor regime memorized conjunctions and sign-flipped across seeds; start
# at 2 and keep the difficulty gate). Diagonal (a==b) combos are held out; every a-value and b-value
# still appears off-diagonal, so a factored decode can generalize while a conjunction head cannot.
samples: 600
n_a: 4
n_b: 4
world_dim: 16
separation: 1.0
world_noise: 0.9
form_noise: 0.5
cross_leak: 0.15
epochs: 120
lr: 0.03
gap_margin: 0.15
margin: 0.1
seeds: [0, 1, 2, 3, 4]
