# MoT preregistration mirror (WP-02): registry row mop_at3_time_axis in registry/experiments.yaml.
# The null_hypothesis is carried VERBATIM from the registry row (which mirrors section 11 of
# docs/mixture_of_perspectives/11_experiment_registry.md). This row runs as a standalone script
# (status registry-only), not through mop.experiments.REGISTRY: scripts/mop_at3_time_axis.py
# writes its verdict json to runs/mot/at3_time_axis.json.
id: mop_at3_time_axis
name: time_axis_ablation
module: scripts/mop_at3_time_axis.py
metric: [full_clip_minus_single_frame_decode]
