# E4: neuromodulation (uncertainty-gated learning) on the mandatory noisy-TV test.
# An ensemble of forward predictors learns a LEARNABLE region and faces a NOISE region.
# Three gates decide where learning/attention goes: ungated, point-error gated,
# ensemble-disagreement gated. The contract: point-error gating chases the noisy-TV (treats
# irreducible aleatoric noise like learnable epistemic uncertainty) while disagreement does
# not. A GaussianHead on the learnable region reports calibration (ECE). Tier: cpu-now.
id: e4_neuromod
name: neuromodulation_uncertainty_gating
module: e4_neuromod
metric: [adapt_speed_learnable, gate_on_noise, calibration_ece]
null_hypothesis: "point prediction-error gating allocates as much to noisy-TV as ungated (conflates epistemic with aleatoric) while ensemble disagreement does not"
tier: cpu-now

dim: 48
n: 256
separation: 2.0
noise_scale: 6.0
ensemble_size: 5
hidden: 96
depth: 2
steps: 240            # toy: a couple hundred adam steps, seconds on cpu
batch: 96
lr: 1.0e-3
chase_ratio: 0.6      # point-error gate-on-noise must be >= this fraction of ungated to "chase"
ignore_ratio: 0.6     # disagreement gate-on-noise must be <= this fraction of ungated to "ignore"
cal_hidden: 64
cal_epochs: 120
