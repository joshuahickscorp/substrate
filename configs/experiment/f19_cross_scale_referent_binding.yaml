id: f19_cross_scale_referent_binding
name: cross_scale_referent_binding
module: f_form_substrate
metric: [cross_scale_recall_at_k, flat_memory_recall_at_k, recall_per_byte]
null_hypothesis: "hierarchical referent memory ties the strongest flat, single-scale, or random-hierarchy control at matched bytes, so scale structure buys no retrieval and memory stays clip-shaped"
tier: cpu-now

# A nested, shared geometric world. All four arms allocate the same ReplayBuffer arrays and metadata;
# only their referent organization changes. The hierarchy must hold every coarse node before spending
# remaining slots on stratified objects, so store_vectors must be between 39 and 108 with these defaults.
tasks: 3
episodes_per_task: 3
scenes_per_episode: 3
objects_per_scene: 4
world_dim: 16
task_separation: 1.0
episode_spread: 0.75
scene_spread: 0.55
object_spread: 0.5
store_noise: 1.4
query_noise: 1.6
duplicate_noise: 0.05
scale_weight: 8.0
store_vectors: 96
queries_per_relation: 48
k: 1
margin: 0.05
seeds: [0, 1, 2, 3, 4]
