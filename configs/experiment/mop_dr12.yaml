# MoT preregistration mirror (WP-02): registry row mop_dr12_disagreement in registry/experiments.yaml.
# The null_hypothesis is carried VERBATIM from the registry row (which mirrors section 11 of
# docs/mixture_of_perspectives/11_experiment_registry.md). This row runs as a standalone script
# (status registry-only), not through mop.experiments.REGISTRY: scripts/mop_dr12_disagreement.py
# writes its verdict json to runs/mot/dr12_disagreement.json.
id: mop_dr12_disagreement
name: disagreement_as_uncertainty
module: scripts/mop_dr12_disagreement.py
metric: [error_prediction_auroc, adaptation_per_update, noisy_tv_pass]
null_hypothesis: "disagreement ties single-head confidence AND gating on it ties uniform compute, OR it chases irreducible noise (fails noisy-TV, the e4 pattern)"
falsifier: "disagreement AUROC <= confidence AUROC, or fails noisy-TV"
tier: cpu-now
seeds: '0-4'
output: runs/mot/dr12_disagreement.json
pilot: false
