id: f20_substrate_crisis_test
name: substrate_crisis_test
module: f_form_substrate
metric: [crisis_auroc, raw_error_auroc, false_trigger_rate, avoided_wasted_compute_per_monitor_flop]
null_hypothesis: "the crisis detector fails to beat the strongest raw-error, fixed-confidence, or random baseline, or triggers on aleatoric noise, so prospective insufficiency is not established"
tier: cpu-now

samples: 320
dim: 24
classes: 4
nuis_classes: 4
epochs: 120
lr: 0.05
train_frac: 0.6
rho: 0.85
world_noise: 0.7
nuisance_crisis: 2.4
signal_wall: 0.7
nuisance_wall: 1.2
wall_noise: 2.6
signal_healthy: 1.4
nuisance_side: 1.6
n_crisis: 8
n_wall: 8
n_healthy: 8
n_noise: 10
fail_threshold: 0.42
crisis_trigger_threshold: 0.20
error_threshold: 0.5
shell_scaleup_flops: 1.0e10
margin: 0.1
noise_margin: 0.12
seeds: [0, 1, 2, 3, 4]
