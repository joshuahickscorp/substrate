id: n10_halting_difficulty
name: confidence_halting_tracks_difficulty
module: n_neuro_replay_reasoning
metric: [halt_step_vs_difficulty_corr, accuracy_at_lower_compute]
null_hypothesis: "halting is uncorrelated with difficulty (the halt head is noise), or adaptive halting loses accuracy with no compute saving"
tier: cpu-now

dim: 40
hidden: 64
steps: 6
n_classes: 4
samples: 220
separation: 1.5
halt_threshold: 0.9
corr_margin: 0.05
epochs: 70
lr: 0.05
margin: 0.03
seeds: [0, 1]
