id: f10_intrinsic_form_curriculum
name: intrinsic_form_curriculum
module: f_form_substrate
metric: [coverage_per_update, noisy_form_timeshare, transfer_gain]
null_hypothesis: "learning-progress form selection ties uniform coverage or chases the noisy form"
tier: cpu-now

# Real forms are kept hard and the budget tight (few rounds, few steps) so a form is NOT saturated
# within the budget: this is the regime where learning-progress can starve the unlearnable noisy form
# and reach higher coverage than uniform. A ceilinged world would make every policy tie at 1.0.
samples: 300
classes: 10
world_dim: 16
feature_dim: 16
separation: 0.85
world_noise: 0.9
form_noise: 0.4
train_frac: 0.6
n_noisy: 5
rounds: 20
steps: 1
lr: 0.04
margin: 0.02
noisy_margin: 0.05
seeds: [0, 1, 2]
