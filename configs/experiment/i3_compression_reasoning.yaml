id: i3_compression_reasoning
name: compression_damages_reasoning
module: i_infotheory
metric: [reasoning_minus_classification_slope, bits_to_lose_refiner_advantage, refiner_gain]
null_hypothesis: "the reasoning and classification accuracy-vs-bits slopes are equal within seed spread, or the refiner has no advantage to lose even uncompressed"
tier: cpu-now

dim: 48
n_classes: 4
samples: 200
separation: 2.0
hidden: 64
steps: 4
bits: [2, 3, 4, 8]
margin: 0.02
slope_margin: 0.01
epochs: 60
lr: 0.01
seeds: [0, 1]
