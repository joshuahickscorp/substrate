# E5: curiosity as self-curriculum. Tier: cpu-now. The scored fixed-pool comparison and a
# deterministic persistent learnable-vs-noisy trajectory contract both execute locally.
id: e5_curiosity
name: curiosity_self_curriculum
module: e5_curiosity
metric: [noise_fraction, learnable_improvement, lp_resists_noise, pe_chases_noise]
null_hypothesis: "prediction-error/RND curiosity chases the noisy-TV while learning-progress curiosity does not"
tier: cpu-now

# fixed pool: learnable (structured dynamics) + noise (irreducibly random targets)
dim: 32
n_each: 128            # samples per region; pool size is 2*n_each
separation: 3.0
noise_scale: 5.0       # noisy-TV target spread (error stays high, progress goes to 0)

# selection loop
rounds: 8
select_k: 32           # samples trained on per round
train_steps: 12        # gradient steps per round on the selected batch
noise_threshold: 0.5   # selected-noise fraction above which a policy "chases" the noisy-TV

# predictor
hidden: 64
depth: 2
lr: 0.01

# bounded persistent environment contract (programmatic mechanics, never natural embodiment)
environment_episodes: 8
environment_horizon: 10
