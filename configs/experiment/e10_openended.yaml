# E10: minimal open-ended JEPA (capstone). SCAFFOLD ONLY with a stub environment. Tier:
# env-later. NOT run at scale: the real version needs a parameterizable procedural environment,
# an environment-generation loop, and rented-GPU rollouts. Here the ablation ladder spine runs
# in seconds so the contract and the null check are exercised.
id: e10_openended
name: minimal_open_ended_jepa
module: e10_openended
metric: [distinct_skills, skill_reuse, archive_diversity, collapse]
null_hypothesis: "the single agent plateaus; open-endedness needs population-level search and environment generation, not just a richer single agent"
tier: env-later

# stub environment + archive params (toy scale, seconds)
dim: 32                 # latent-like observation dimensionality of the stub env
n_primitives: 6         # compositional action primitives (stepping stones in principle)
n_actions: 120          # short toy loop length per arm
horizon: 4              # rollout steps per action (short, per the substrate horizon limit)
bins: 4                 # MAP-Elites cells per descriptor axis
descriptor_dim: 3       # behavior-signature dimensionality (bins**descriptor_dim niches max)
plateau_eps: 0.05       # relative diversity gain below this on the last rung => plateau
