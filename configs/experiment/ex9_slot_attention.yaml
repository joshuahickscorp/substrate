# EX9: object-centric / slot attention over pooled latents (E6 precursor).
# K learnable slot queries cross-attend over a window of T pooled per-clip latents on a
# relation-change task (two entities, relation read off geometry at window end); compared
# against a parameter-matched flat-pooled MLP baseline, both against a frozen_random control.
# Pooled-only mechanism (registry text never requires a dense arm): tier cpu-now, no encoder
# weights needed, runs entirely on synthetic latents in real minutes on a laptop CPU.
id: ex9_slot_attention
name: slot_attention_relation_change
module: ex9_slot_attention
metric: [relation_decoding, pooled_ceiling_gap]
null_hypothesis: "slot attention over pooled latents ties the parameter-matched flat baseline; pooled features carry no per-slot structure to factor"
tier: cpu-now

dim: 1024              # pooled-latent dimensionality, matches vjepa2_vitl_fpc64_256 embed_dim
window_len: 8            # consecutive pooled per-clip latents per window (4-8 range per spec)
n_relations: 4          # contained + 3 distance bands; small-multiclass relation label
contain_radius: 1.5     # distance threshold separating "contained" from the first distance band
entity_speed: 0.35      # per-step random-walk scale for each entity's trajectory
pool_noise: 0.4         # additive noise on the pooled (summed) per-clip latent
change_frac: 0.5        # fraction of windows whose relation changes partway through

n_windows: 8000          # scaled default: real minutes on CPU (~90s measured), not a toy handful
n_slots: 10               # learned slot queries
slot_hidden: 160          # slot attention hidden width; flat arm is width-matched to this budget

epochs: 350
lr: 0.01
tie_eps: 0.02            # slot must beat flat (and frozen_random) by more than this to reject the null
