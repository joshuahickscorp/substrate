schema: mop-p9-causal-monitoring-config/v1
id: p9_causal_monitoring_preflight
name: operational_self_model_causal_monitoring_mechanics
claim_scope: deterministic structural-fixture mechanics only; no natural-workload, capability, cognition, sentience, or energy claim
null_hypothesis: >-
  causal internal telemetry adds no prospective calibration, intervention sensitivity, selective
  control utility, or failure warning beyond external error, a fixed threshold controller,
  final-output decoding, correlational proxies, random telemetry, shuffled telemetry, or telemetry
  lesions; this bounded structural fixture cannot reject that null for a natural workload

fixture:
  train_lineages_per_unit: 24
  calibration_lineages_per_unit: 12
  heldout_lineages_per_unit: 16
  causal_bins: 8
  smoothing_candidates: [1, 2, 4]
  decision_threshold_numerator: 1
  decision_threshold_denominator: 2
  pressure_cost: 0
  relief_cost: 1
  failure_cost: 5
  interventions:
    - name: observational
      queue_delta: 0
      memory_delta: 0
      retry_delta: 0
    - name: queue_pressure
      queue_delta: 3
      memory_delta: 0
      retry_delta: 0
    - name: memory_pressure
      queue_delta: 0
      memory_delta: 3
      retry_delta: 0
    - name: retry_pressure
      queue_delta: 0
      memory_delta: 0
      retry_delta: 2
    - name: resource_relief
      queue_delta: -2
      memory_delta: -2
      retry_delta: 0
  independent_units:
    - unit_id: compile-burst
      seed: 202607101
      failure_threshold: 16
    - unit_id: decode-stream
      seed: 202607102
      failure_threshold: 17
    - unit_id: cache-churn
      seed: 202607103
      failure_threshold: 15
    - unit_id: checkpoint-spike
      seed: 202607104
      failure_threshold: 16
    - unit_id: mixed-session
      seed: 202607105
      failure_threshold: 17

evaluation:
  primary_arm: causal_abstraction
  histogram_arms:
    - causal_abstraction
    - correlational_proxy
    - external_error_only
    - final_output_decoder
    - random_telemetry
    - telemetry_lesion
    - telemetry_shuffled
  structural_controls:
    - fixed_threshold_pid
    - oracle_structural
  correlational_comparator: correlational_proxy
  pressure_interventions: [queue_pressure, memory_pressure, retry_pressure]
  control_intervention: resource_relief
  require_matched_histogram_capacity: true

resource_envelope:
  device: cpu
  cpu_threads: 1
  maximum_wall_seconds: 10
  maximum_rss_bytes: 1073741824
  maximum_proof_bytes: 1048576
  accelerator_required: false
  model_weights_loaded: false
  model_downloads_allowed: false
  external_data_allowed: false

stop_contract:
  minimum_independent_units: 5
  require_disjoint_lineages: true
  require_same_parent_branches: true
  require_complete_intervention_sets: true
  require_confounder_shift: true
  require_exact_resume: true
  require_all_mutations_rejected: true
  stop_on_nonfinite_metric: true
  scientific_promotion_allowed: false
