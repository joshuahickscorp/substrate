id: ex4_fast_weights
name: fast_weight_hypernetwork_shells
module: ex4_fast_weights
metric: [accuracy_held_out, hypernet_acc, static_acc, gradient_tta_acc, adaptation_speed, collapse_cosine]
null_hypothesis: "in-context plasticity does not match gradient plasticity, or the hypernet collapses to a context-independent average shell"
tier: cpu-now

# the fast-weight toy: task-incremental stream (shared label space, independent geometry per task).
# hypernet h(context) -> linear-head weights in one forward pass, meta-trained on TRAIN tasks, evaluated
# zero-gradient on HELD-OUT tasks (unseen geometry) against a pooled static head and a gradient-TTA arm.
dim: 32
hidden: 64
n_classes: 4
n_train_tasks: 8
n_held_out_tasks: 4
samples: 160
separation: 2.0
ctx_frac: 0.5     # fraction of each task's samples used as context; the rest are query/eval
epochs: 100       # meta-training epochs for the hypernet; also used for the static head
lr: 1.0e-3
tta_lr: 1.0e-2
tta_max_steps: 20
margin: 0.03          # accuracy margin: hypernet must beat static head by more than this to "win"
collapse_thresh: 0.98 # cosine similarity of h(context_A) vs h(context_B) at/above this -> collapse
seeds: [0, 1]
